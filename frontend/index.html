<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#f7faf9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#091711" media="(prefers-color-scheme: dark)" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Jirjirak WireGuard - WireGuard infrastructure management" />
    <title>Jirjirak WireGuard</title>
    <script>
      // Apply the saved (or system) theme before first paint to avoid a flash
      // of the wrong theme. Kept in sync with src/lib/theme.ts.
      ;(() => {
        try {
          const stored = localStorage.getItem('wgpanel-theme')
          const dark =
            stored === 'dark' ||
            ((stored === null || stored === 'system') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
          // Same for language/direction (src/lib/i18n.tsx) - no LTR flash for Persian.
          const lang =
            localStorage.getItem('wgpanel-lang') ||
            (navigator.language.toLowerCase().startsWith('fa') ? 'fa' : 'en')
          document.documentElement.lang = lang === 'fa' ? 'fa' : 'en'
          document.documentElement.dir = lang === 'fa' ? 'rtl' : 'ltr'
        } catch {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
