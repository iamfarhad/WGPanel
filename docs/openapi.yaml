openapi: 3.0.3
info:
  title: WGPanel API
  description: |
    WGPanel manages WireGuard nodes and peer ("account") provisioning behind a
    separate Telegram sales bot. This panel deliberately has **no concept of
    payments, pricing, or plans** — the bot owns all of that and talks to this
    API using a scoped, HMAC-signed API key. Admin/operator users manage the
    same resources through the same endpoints using a JWT session instead.

    ## Authentication

    Every endpoint under `/api/v1/*` (except `POST /api/v1/auth/login`,
    `POST /api/v1/auth/refresh`, and `POST /api/v1/nodes/join`) requires
    **one** of:

    - **Admin session** — `Authorization: Bearer <access_token>` from
      `POST /api/v1/auth/login`. Access tokens are short-lived (15 minutes);
      exchange the refresh token via `POST /api/v1/auth/refresh` before it
      expires. Admin sessions are additionally subject to role checks
      (`support` < `operator` < `super_admin`) documented per-operation below.
    - **Bot/reseller API key** — three headers together:
      `X-API-Key` (the key ID), `X-Timestamp` (unix seconds), and
      `X-Signature` (hex HMAC-SHA256). The signed payload is exactly:

      ```
      {METHOD}\n{URL_PATH}\n{TIMESTAMP}\n{RAW_BODY}
      ```

      `METHOD` is the uppercase HTTP verb, `URL_PATH` is the request path
      with no query string, `TIMESTAMP` is the literal `X-Timestamp` header
      value (not re-serialized), and `RAW_BODY` is the exact request body
      bytes (empty string for bodyless requests). Compute the HMAC with the
      API key's secret (returned **once**, at creation or rotation time) and
      hex-encode it. Requests outside a ±5 minute timestamp window are
      rejected regardless of signature validity. API keys carry their own
      `permissions` (a subset of `read`/`create`/`update`/`suspend`/`delete`)
      and `node_groups` scoping (empty = unrestricted).

    These two mechanisms are mutually exclusive per request — the server
    checks for a non-empty `Authorization` header first and, if absent, falls
    back to the three `X-*` headers.

    ## Error format

    Every error response, from every endpoint, uses exactly this envelope:

    ```json
    { "error": { "code": "account_not_found", "message": "no account with that id" } }
    ```

    `code` is a stable machine-readable string (see the shared
    `ErrorEnvelope` schema and per-operation `4xx`/`5xx` responses below);
    `message` is a human-readable string that MAY change wording over time —
    integrate against `code`, not `message`.

    ## Rate limiting

    Bot API requests authenticated with an API key are limited by a token bucket
    **per key** (default 20 requests/second, burst 40; both configurable in
    Settings as `api_rate_rps` / `api_rate_burst`). The limiter runs after the
    signature check, so a forged request can never use up a real key's budget.
    Every response to a keyed request carries `X-RateLimit-Limit` (bucket
    capacity), `X-RateLimit-Remaining` (whole tokens left) and
    `X-RateLimit-Reset` (seconds until the bucket is full again). When the bucket
    is empty the API answers `429` with code `rate_limited` and a `Retry-After`
    header (seconds). The public subscription endpoints are limited **per client
    IP** instead (a generous bucket, plus a much stricter allowance for unknown
    tokens so token guessing stops after a handful of tries) and answer the same
    `429`.

    ## Two listeners

    This spec documents two distinct HTTP servers this backend runs:

    1. **Main API** (`HTTP_PORT`, default `8080`) — everything under
       `/api/v1/*`, `/healthz`, and `/internal/*`. This is what admins, the
       Telegram bot, and `POST /api/v1/nodes/join` (install-node.sh) talk to.
    2. **Node agent listener** (`NODE_AGENT_PORT`, default `48443`) — `/agent/register`
       and `/agent/heartbeat` only, served over mTLS by this project's internal
       CA. `/agent/register` needs no client certificate (the one-time join
       token IS the credential); `/agent/heartbeat` requires a client
       certificate issued by a prior `/agent/register` call. OpenAPI 3.0 has
       no first-class way to express "TLS client certificate required"
       as a security scheme, so this requirement is called out in each
       operation's description instead — it is enforced at the TLS layer,
       before the handler ever runs.
  version: "1.0.0"
  contact:
    name: WGPanel
servers:
  - url: /
    description: >-
      Main API host. All paths below are absolute (e.g. /api/v1/nodes,
      /healthz, /internal/admins), matching the real Go net/http mux exactly -
      there is no shared path prefix across every route.
  - url: https://node-agent.internal:48443
    description: >-
      Node agent mTLS listener (NODE_AGENT_PORT). Separate TLS listener, separate
      trust root (this project's internal CA) - not reachable through the main
      API's port or through Caddy's public reverse proxy. Only the /agent/*
      operations below use this server (see their per-operation `servers`
      override).

tags:
  - name: Notifications
    description: In-panel notification center and Telegram/email notification channels.
  - name: Webhooks
    description: Signed outbound webhooks with a persistent retry queue and delivery log.
  - name: Reports
    description: Traffic, account-status, quota and expiry reporting for staff and resellers.
  - name: Resellers
    description: Reseller logins with account/traffic/expiry/node-group limits (super_admin manages; reseller self-service is limited to its own accounts).
  - name: Auth
    description: Admin login/session management.
  - name: Security
    description: Admin sign-in security - TOTP two-factor, recovery codes, passkeys (WebAuthn), login lockout and the admin IP allowlist.
  - name: Nodes
    description: WireGuard server (node) directory and lifecycle.
  - name: Obfuscation
    description: AmneziaWG obfuscation profiles - parameter sets assigned to nodes (a node with a profile runs AmneziaWG instead of kernel WireGuard), one-click rotation and bulk assignment per node group.
  - name: Templates
    description: Plan templates - named bundles of quota, duration, limits, reset schedule and on-hold settings used to create accounts.
  - name: Accounts
    description: >-
      WireGuard peer provisioning and lifecycle. **Limits are enforced by the
      panel.** An `active` account is suspended automatically when it expires
      (`suspend_reason: expired`) or when `data_used_bytes` reaches
      `data_quota_bytes` (`suspend_reason: quota_exceeded`; an account with a
      null quota is unlimited and never suspended for data - note that a quota
      of `0` is a cap of zero bytes, not "unlimited", so such an account is
      suspended the first time it is read). The traffic path
      does this within the heartbeat that brings the usage to the cap, and every
      read does it too (so a quota lowered below the usage reads as suspended at
      once); node agents then drop the peer within one heartbeat. Only `active`
      accounts are touched - any other suspension reason is kept - and when an
      account is both expired and over its cap, `expired` wins, so adding data
      never revives an expired account. It is lifted again by moving the cap
      above the usage (`PATCH` a higher `data_quota_gb` or `clear_data_quota`,
      `renew` with `add_quota_gb`) or by `reset-usage`, provided the account has
      not expired.
  - name: Subscription
    description: >-
      Unauthenticated capability-URL surface for client apps: the per-account
      subscription token in the path is the credential. Serves the account's
      current config with steering-based node selection.
  - name: API Keys
    description: Bot/reseller credentials for the HMAC-signed integration surface. super_admin only.
  - name: Admin Users
    description: Panel operator accounts and roles. super_admin only.
  - name: Audit Log
    description: Append-only record of every mutating action. super_admin only.
  - name: Settings
    description: Panel-wide configuration and defaults. Readable by any admin, editable by super_admin only.
  - name: Backup
    description: >-
      Whole-panel backup & restore as a single JSON file. super_admin only, both
      directions audit-logged. The file contains every panel secret except
      deploy/.env - treat it like the database itself.
  - name: Health
    description: Liveness/readiness probes.
  - name: Node Agent
    description: >-
      Endpoints served on the separate mTLS listener (NODE_AGENT_PORT), called by
      cmd/agent running on each WireGuard node - never called by the admin panel
      or the Telegram bot directly.

paths:
  /healthz:
    get:
      tags: [Health]
      summary: Public liveness probe
      security: []
      responses:
        "200":
          description: Process is up (does not check DB/Redis - see /internal/healthz for that).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }

  /internal/healthz:
    get:
      tags: [Health]
      summary: Readiness probe (DB + Redis reachability)
      description: >-
        Gated by `X-Internal-Token` (must equal the `INTERNAL_API_TOKEN` env var),
        not by admin/API-key auth. Not reachable from the public internet in the
        reference deployment (Caddy doesn't proxy `/internal/*`; Docker publishes
        the API port on `127.0.0.1` only) - but the token is the actual security
        boundary, since sibling containers on the same network can still reach it.
      security:
        - InternalToken: []
      responses:
        "200":
          description: Database and Redis are both reachable.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
        "503":
          description: Database or Redis unreachable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /internal/admins:
    post:
      tags: [Admin Users]
      summary: Create the first super_admin (CLI bootstrap only)
      description: >-
        Used by the `wgpanel create-admin` CLI command during installation, not
        by the frontend. Gated by `X-Internal-Token`. Unlike
        `POST /api/v1/admins`, this endpoint defaults role to `super_admin` and
        does not validate the role against an allow-list - it exists purely to
        create the very first operator before any admin session exists.
      security:
        - InternalToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
                role: { type: string, default: super_admin }
      responses:
        "201":
          description: Admin created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminCreateResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409":
          description: Username already taken.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "500": { $ref: "#/components/responses/InternalError" }

  /internal/nodes/bootstrap-self:
    post:
      tags: [Nodes]
      summary: Create a node and generate its join token in one call (install.sh only)
      description: >-
        Used by `install.sh` to self-register the panel's own server as its
        first WireGuard node (docs/STORY-09-multi-node-accounts.md), combining
        `POST /api/v1/nodes` + `POST /api/v1/nodes/{id}/join-token` into one
        install-time convenience call. Gated by `X-Internal-Token`, same trust
        tier as `/internal/admins`. The resulting node behaves identically to
        one created through the admin panel - this is not a distinct node type.
      security:
        - InternalToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateNodeRequest" }
      responses:
        "201":
          description: Node created and a join token generated for it.
          content:
            application/json:
              schema:
                type: object
                properties:
                  node_id: { type: string, format: uuid }
                  token: { type: string }
                  expires_at: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409":
          description: A node with this name already exists.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Log in with username/password
      description: >-
        If the admin has two-factor authentication (TOTP and/or passkeys) and the password is
        correct, the response is `{mfa_required: true, mfa_token, methods}` with **no** session
        tokens; finish with `POST /api/v1/auth/mfa/totp`, `/mfa/recovery` or
        `/mfa/passkey/*`. Failed attempts are counted per username and per client IP in Redis
        (defaults: 5 failures lock for 15 minutes, doubling on repeat lockouts; thresholds are in
        Settings -> Security) - a locked caller gets `429 too_many_attempts` with a `Retry-After`
        header, even with a correct password. When the admin IP allowlist is set, an address
        outside it gets `403 ip_not_allowed`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
      responses:
        "200":
          description: Authenticated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token: { type: string, description: "JWT, 15 minute TTL" }
                  refresh_token: { type: string, description: "Redis-backed, 7 day TTL" }
                  expires_in_seconds: { type: integer, example: 900 }
                  mfa_required: { type: boolean, description: "true instead of the tokens above when a second factor is needed" }
                  mfa_token: { type: string, description: "Short-lived (5 min), single-use; exchange it at /auth/mfa/*" }
                  methods:
                    type: array
                    items: { type: string, enum: [totp, recovery, passkey] }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: Invalid username or password (same response for both cases, to avoid leaking which one was wrong).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "403":
          description: "`ip_not_allowed` - the caller's IP is not on the admin IP allowlist."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "429": { $ref: "#/components/responses/TooManyAttempts" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Exchange a refresh token for a new access token
      description: >-
        Does NOT rotate the refresh token - the same refresh token remains valid
        and reusable until its own 7-day TTL expires. A rotating-refresh-token
        design was deliberately deferred (see docs/STORY-06).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        "200":
          description: New access token issued.
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token: { type: string }
                  expires_in_seconds: { type: integer, example: 900 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: Refresh token is invalid, expired, or its admin no longer exists.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/auth/mfa/totp:
    post:
      tags: [Auth]
      summary: Finish a two-factor login with an authenticator code
      description: Exchanges `mfa_token` + a 6-digit TOTP code for the normal token pair. The token is single-use; 5 wrong codes burn it. Wrong codes count toward the login lockout.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mfa_token, code]
              properties:
                mfa_token: { type: string }
                code: { type: string, example: "123456" }
      responses:
        "200": { $ref: "#/components/responses/SessionTokens" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: "`invalid_mfa_code` or `mfa_token_invalid` (expired / already used)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "403":
          description: "`ip_not_allowed`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "429": { $ref: "#/components/responses/TooManyAttempts" }

  /api/v1/auth/mfa/recovery:
    post:
      tags: [Auth]
      summary: Finish a two-factor login with a one-time recovery code
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mfa_token, recovery_code]
              properties:
                mfa_token: { type: string }
                recovery_code: { type: string, example: "abcde-fghij" }
      responses:
        "200": { $ref: "#/components/responses/SessionTokens" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: "`invalid_mfa_code` or `mfa_token_invalid`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "403":
          description: "`ip_not_allowed`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "429": { $ref: "#/components/responses/TooManyAttempts" }

  /api/v1/auth/mfa/passkey/begin:
    post:
      tags: [Auth]
      summary: Start a passkey assertion as the second factor
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mfa_token]
              properties:
                mfa_token: { type: string }
      responses:
        "200": { $ref: "#/components/responses/PasskeyOptions" }
        "400":
          description: "`invalid_request`, `no_passkeys` or `passkeys_unavailable` (the page's Origin is not the panel domain over HTTPS, or http://localhost)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "401":
          description: "`mfa_token_invalid`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "429": { $ref: "#/components/responses/TooManyAttempts" }

  /api/v1/auth/mfa/passkey/finish:
    post:
      tags: [Auth]
      summary: Finish the passkey second factor
      description: Body is the raw `PublicKeyCredential` JSON produced by `navigator.credentials.get()`. `session` is the `session_id` from begin.
      security: []
      parameters:
        - { name: session, in: query, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, description: "WebAuthn assertion response (base64url fields)" }
      responses:
        "200": { $ref: "#/components/responses/SessionTokens" }
        "400":
          description: "`passkey_session_expired` or `passkeys_unavailable`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "401":
          description: "`invalid_mfa_code` (assertion failed, including a non-increasing signature counter) or `mfa_token_invalid`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "429": { $ref: "#/components/responses/TooManyAttempts" }

  /api/v1/auth/passkey/begin:
    post:
      tags: [Auth]
      summary: Start a passwordless passkey sign-in
      description: Discoverable (usernameless) credentials; user verification is required. The RP ID is derived from the panel domain (or `localhost` over http for development).
      security: []
      responses:
        "200": { $ref: "#/components/responses/PasskeyOptions" }
        "400":
          description: "`passkeys_unavailable`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "403":
          description: "`ip_not_allowed`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "429": { $ref: "#/components/responses/TooManyAttempts" }

  /api/v1/auth/passkey/finish:
    post:
      tags: [Auth]
      summary: Finish a passwordless passkey sign-in
      description: Body is the raw `PublicKeyCredential` JSON from `navigator.credentials.get()`. Returns the normal token pair.
      security: []
      parameters:
        - { name: session, in: query, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, description: "WebAuthn assertion response (base64url fields)" }
      responses:
        "200": { $ref: "#/components/responses/SessionTokens" }
        "400":
          description: "`passkey_session_expired` or `passkeys_unavailable`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "401":
          description: "`invalid_passkey`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "403":
          description: "`ip_not_allowed`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "429": { $ref: "#/components/responses/TooManyAttempts" }

  /api/v1/me/security:
    get:
      tags: [Security]
      summary: The caller's own two-factor / passkey status
      description: Available to every admin role including resellers; always scoped to the session's own admin.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Current status.
          content:
            application/json:
              schema:
                type: object
                properties:
                  totp_enabled: { type: boolean }
                  totp_pending: { type: boolean, description: "An enrolment was started but not confirmed." }
                  recovery_codes_remaining: { type: integer }
                  passkeys:
                    type: array
                    items: { $ref: "#/components/schemas/Passkey" }
                  passkeys_supported: { type: boolean }

  /api/v1/me/security/totp/enroll:
    post:
      tags: [Security]
      summary: Start TOTP enrolment
      description: Returns the Base32 secret and an `otpauth://` URI (render it as a QR code). Nothing is enforced until `confirm`. Calling again before confirming replaces the pending secret.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Pending secret.
          content:
            application/json:
              schema:
                type: object
                properties:
                  secret: { type: string }
                  otpauth_uri: { type: string }
        "409":
          description: "`totp_already_enabled`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /api/v1/me/security/totp/confirm:
    post:
      tags: [Security]
      summary: Confirm TOTP enrolment with a code
      description: Activates two-factor authentication and returns 10 one-time recovery codes **once** (stored only as hashes).
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        "200": { $ref: "#/components/responses/RecoveryCodes" }
        "401":
          description: "`invalid_mfa_code`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "409":
          description: "`totp_not_pending`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /api/v1/me/security/totp/disable:
    post:
      tags: [Security]
      summary: Disable TOTP (needs the password and a code)
      description: Also removes the recovery codes. Passkeys are separate and stay. The code may be a TOTP code or an unused recovery code.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, code]
              properties:
                password: { type: string, format: password }
                code: { type: string }
      responses:
        "204": { description: Disabled. }
        "401":
          description: "`invalid_credentials` or `invalid_mfa_code`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "429": { $ref: "#/components/responses/TooManyAttempts" }

  /api/v1/me/security/recovery-codes:
    post:
      tags: [Security]
      summary: Regenerate the recovery codes (needs the password and a code)
      description: Invalidates every earlier recovery code and returns 10 new ones once.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, code]
              properties:
                password: { type: string, format: password }
                code: { type: string }
      responses:
        "200": { $ref: "#/components/responses/RecoveryCodes" }
        "401":
          description: "`invalid_credentials` or `invalid_mfa_code`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "409":
          description: "`totp_not_enabled`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "429": { $ref: "#/components/responses/TooManyAttempts" }

  /api/v1/me/security/passkeys/begin:
    post:
      tags: [Security]
      summary: Start registering a passkey
      description: Creation options (discoverable credential, user verification required) plus a `session_id` held in Redis for 5 minutes. At most 10 passkeys per admin (`passkey_limit`).
      security:
        - BearerAuth: []
      responses:
        "200": { $ref: "#/components/responses/PasskeyOptions" }
        "400":
          description: "`passkeys_unavailable`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "409":
          description: "`passkey_limit`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /api/v1/me/security/passkeys/finish:
    post:
      tags: [Security]
      summary: Finish registering a passkey
      description: Body is the raw `PublicKeyCredential` JSON from `navigator.credentials.create()`.
      security:
        - BearerAuth: []
      parameters:
        - { name: session, in: query, required: true, schema: { type: string } }
        - { name: name, in: query, required: false, schema: { type: string, maxLength: 64 }, description: "Label shown in the list (default Passkey)." }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, description: "WebAuthn attestation response (base64url fields)" }
      responses:
        "201":
          description: Registered.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Passkey" }
        "400":
          description: "`passkey_session_expired`, `passkey_verification_failed` or `passkeys_unavailable`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "409":
          description: "`passkey_exists`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /api/v1/me/security/passkeys/{id}:
    delete:
      tags: [Security]
      summary: Delete one of the caller's passkeys
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Deleted. }
        "404":
          description: "`passkey_not_found`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /api/v1/admins/{id}/mfa:
    delete:
      tags: [Security]
      summary: Reset an admin's two-factor authentication (super_admin)
      description: Removes the admin's TOTP secret, recovery codes and passkeys. Audited as `admin.mfa_reset`.
      security:
        - BearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Reset. }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: "`admin_not_found`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /api/v1/security/settings:
    get:
      tags: [Security]
      summary: Login lockout thresholds and the admin IP allowlist (super_admin)
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Current settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecuritySettings" }
        "403": { $ref: "#/components/responses/Forbidden" }
    patch:
      tags: [Security]
      summary: Update the lockout thresholds / admin IP allowlist (super_admin)
      description: >-
        An empty `admin_ip_allowlist` removes the restriction. A non-empty list is refused with
        `allowlist_excludes_you` (400) if it would not include the requesting admin's own IP. The
        allowlist applies to the admin login flow and JWT-authenticated admin routes only - never to
        subscription URLs, node-agent connections or API-key requests. Break-glass: run
        `wgpanel clear-ip-allowlist` on the server.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                admin_ip_allowlist:
                  type: array
                  maxItems: 100
                  items: { type: string, example: "203.0.113.0/24" }
                login_max_failures: { type: integer, minimum: 1, maximum: 100 }
                login_lockout_minutes: { type: integer, minimum: 1, maximum: 1440 }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecuritySettings" }
        "400":
          description: "`invalid_request` or `allowlist_excludes_you`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/nodes/join:
    post:
      tags: [Nodes]
      summary: Redeem a join token for a plain node record (used by install-node.sh)
      description: >-
        Unauthenticated by admin/API-key standards - the one-time join token
        itself is the credential. Distinct from `/agent/register` on the mTLS
        listener: this returns a plain `Node` JSON object, not a signed
        certificate. install-node.sh calls this to confirm the token is valid
        before handing off to cmd/agent, which then calls `/agent/register`
        for its actual mTLS identity.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "200":
          description: Token redeemed; node's registration is now marked complete.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Node" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: Join token is invalid, expired, or already used.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/nodes:
    post:
      tags: [Nodes]
      summary: Register a new node
      description: Requires an admin session with role >= `operator`.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateNodeRequest" }
      responses:
        "201":
          description: Node created (status starts as `pending` until a real agent registers against it).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Node" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: A node with this name already exists.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "500": { $ref: "#/components/responses/InternalError" }
    get:
      tags: [Nodes]
      summary: List nodes
      description: >-
        Admin session (any role) or API key with `read` permission. API-key
        callers only see nodes in their key's `node_groups` (empty node_groups
        on the key = unrestricted, sees all).
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  nodes:
                    type: array
                    items: { $ref: "#/components/schemas/Node" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/nodes/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Nodes]
      summary: Get a node by id
      description: 404 if the node exists but is outside an API-key caller's node_groups scope (not 403 - avoids confirming the node's existence to a caller who shouldn't see it).
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Node" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    patch:
      tags: [Nodes]
      summary: Update mutable node fields
      description: >-
        Admin session with role >= `operator`. All fields optional; only provided
        fields change. `wg_subnet` is deliberately not editable (peers may already
        be allocated from it). `region: ""` explicitly clears the steering label.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                node_group: { type: string }
                region: { type: string }
                public_endpoint: { type: string }
                capacity_max_peers: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Updated node.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Node" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`node_name_taken`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/obfuscation/presets:
    get:
      tags: [Obfuscation]
      summary: List the built-in obfuscation presets
      description: >-
        Admin session, any role. Presets are templates: creating a profile from
        one generates fresh random parameters. `stock_client_compatible` is true
        for the junk-only preset - the node then still accepts plain WireGuard
        clients (junk packets are only sent by the side that starts a handshake,
        and padding/headers stay stock).
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Presets.
          content:
            application/json:
              schema:
                type: object
                properties:
                  presets:
                    type: array
                    items: { $ref: "#/components/schemas/ObfuscationPreset" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/obfuscation/profiles:
    get:
      tags: [Obfuscation]
      summary: List obfuscation profiles
      description: Admin session, any role (staff only; not available to resellers or API keys).
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Profiles with the number of nodes each is assigned to.
          content:
            application/json:
              schema:
                type: object
                properties:
                  profiles:
                    type: array
                    items: { $ref: "#/components/schemas/ObfuscationProfile" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [Obfuscation]
      summary: Create an obfuscation profile
      description: >-
        Admin session with role >= `operator`. Give either `preset` (an id from
        `/obfuscation/presets`; parameters are generated) or `compat` with
        `params`. Parameters are validated against amneziawg-go's real limits:
        `jc` 0-128; `jmin` <= `jmax` <= 1280 (both 0 when `jc` is 0); `s1` <= 1132,
        `s2` <= 1188 and `s1 + 56` must not equal `s2`; `h1`-`h4` all set or all
        empty, pairwise distinct (awg2: non-overlapping ranges) and >= 5;
        awg2 only: `s3` <= 64, `s4` <= 32, `i1`-`i5` custom signature packets built
        from `<b 0xHEX>`, `<r N>`, `<rc N>`, `<rd N>`, `<t>` totalling <= 1280 bytes.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 64, description: Unique. }
                preset: { type: string, enum: [compatible, awg1, awg2-quic, awg2-dns] }
                compat: { type: string, enum: [awg1, awg2] }
                params: { $ref: "#/components/schemas/ObfuscationParams" }
      responses:
        "201":
          description: Created (revision 1).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ObfuscationProfile" }
        "400":
          description: "`invalid_request` or `invalid_params` (the message names the offending field)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: "`profile_name_taken`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/obfuscation/profiles/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Obfuscation]
      summary: Get an obfuscation profile
      description: Admin session, any role.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: The profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ObfuscationProfile" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: "`profile_not_found`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "500": { $ref: "#/components/responses/InternalError" }
    patch:
      tags: [Obfuscation]
      summary: Update an obfuscation profile
      description: >-
        Admin session with role >= `operator`. `params`, when given, replaces the
        whole parameter set; the merged result is re-validated. The `revision`
        is bumped only when `compat` or the parameters change (not on a rename):
        nodes then reconfigure on their next heartbeat and clients must re-import
        their configs.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 64 }
                compat: { type: string, enum: [awg1, awg2] }
                params: { $ref: "#/components/schemas/ObfuscationParams" }
      responses:
        "200":
          description: The updated profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ObfuscationProfile" }
        "400":
          description: "`invalid_request` or `invalid_params`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: "`profile_not_found`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "409":
          description: "`profile_name_taken`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      tags: [Obfuscation]
      summary: Delete an obfuscation profile
      description: Admin session with role >= `operator`. Refused while any node is assigned the profile.
      security:
        - BearerAuth: []
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: "`profile_not_found`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "409":
          description: "`profile_in_use` - unassign it from its nodes first."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/obfuscation/profiles/{id}/rotate:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Obfuscation]
      summary: Rotate a profile's parameters
      description: >-
        Admin session with role >= `operator`. Regenerates fresh random valid
        parameters, keeping the profile's compat level (and its shape: a
        junk-only profile stays junk-only) and bumps the revision. Nodes
        reconfigure on their next heartbeat (live when only values change,
        otherwise by recreating the interface); **every client config issued for
        those nodes stops working until it is re-imported.** Until a node
        reports the new revision its configs are served without AWG lines.
        Emits the `obfuscation.profile_rotated` event and writes an audit entry.
      security:
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                cps:
                  type: string
                  enum: [keep, quic, dns, none]
                  default: keep
                  description: "awg2 only: keep the I1-I5 signature packets, replace I1 with a fresh QUIC-like or DNS-like one, or clear them."
      responses:
        "200":
          description: The rotated profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ObfuscationProfile" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: "`profile_not_found`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/obfuscation/assign-group:
    post:
      tags: [Obfuscation]
      summary: Assign a profile to every node of a node group
      description: "Admin session with role >= `operator`. A null `profile_id` clears the group's nodes back to plain WireGuard."
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [node_group]
              properties:
                node_group: { type: string }
                profile_id: { type: string, format: uuid, nullable: true }
      responses:
        "200":
          description: Assigned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  node_group: { type: string }
                  profile_id: { type: string, format: uuid, nullable: true }
                  nodes_updated: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: "`profile_not_found` or `node_group_not_found` (no node has that group)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/nodes/{id}/obfuscation:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Obfuscation]
      summary: Get a node's obfuscation state
      description: Admin session, any role.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Assigned profile and what the agent reports running.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NodeObfuscation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    put:
      tags: [Obfuscation]
      summary: Assign an obfuscation profile to a node
      description: >-
        Admin session with role >= `operator`. The node's agent switches to
        AmneziaWG on its next heartbeat; client configs only carry the AWG
        parameters once the node reports the profile applied. `profile_id: null`
        returns the node to plain WireGuard.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                profile_id: { type: string, format: uuid, nullable: true }
      responses:
        "200":
          description: The node's new state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NodeObfuscation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: "`node_not_found` or `profile_not_found`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/nodes/{id}/endpoints:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Nodes]
      summary: List a node's entry endpoints (relays)
      description: >-
        Staff admin sessions only (any role; not available to resellers or API
        keys). Besides its direct `public_endpoint`, a node can have several
        entry endpoints - typically relay servers in a country where the node's
        own address is blocked. Generated configs and subscriptions use the
        **highest-`priority` enabled endpoint that is healthy** (health_check
        `none`, or `tcp` with a recent `up` verdict) and fall back to the node's
        `public_endpoint`, so a node without endpoints behaves exactly as before.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Endpoints, highest priority first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  endpoints:
                    type: array
                    items: { $ref: "#/components/schemas/NodeEndpoint" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [Nodes]
      summary: Add an entry endpoint to a node
      description: Admin session with role >= `operator`.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label, address]
              properties:
                label: { type: string, maxLength: 64, description: Unique per node. }
                address: { type: string, example: "relay.example.ir:51820", description: "host:port written into clients' `Endpoint =`." }
                kind: { type: string, enum: [direct, relay], default: relay }
                priority: { type: integer, default: 100, description: Higher wins. }
                enabled: { type: boolean, default: true }
                mtu: { type: integer, minimum: 1200, maximum: 1420, nullable: true, description: Per-endpoint client MTU override. }
                health_check: { type: string, enum: [none, tcp], default: none }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NodeEndpoint" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`endpoint_label_taken`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/nodes/{id}/endpoints/{endpointId}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: endpointId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Nodes]
      summary: Update a node endpoint
      description: >-
        Admin session with role >= `operator`. Only provided fields change;
        `clear_mtu: true` removes the MTU override. Changing `address` or
        `health_check` resets the health verdict to `unknown`.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label: { type: string }
                address: { type: string }
                kind: { type: string, enum: [direct, relay] }
                priority: { type: integer }
                enabled: { type: boolean }
                mtu: { type: integer, minimum: 1200, maximum: 1420 }
                clear_mtu: { type: boolean }
                health_check: { type: string, enum: [none, tcp] }
      responses:
        "200":
          description: Updated endpoint.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NodeEndpoint" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: "`endpoint_not_found`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "409":
          description: "`endpoint_label_taken`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      tags: [Nodes]
      summary: Delete a node endpoint
      description: Admin session with role >= `operator`.
      security:
        - BearerAuth: []
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: "`endpoint_not_found`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/nodes/{id}/endpoints/{endpointId}/check:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: endpointId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Nodes]
      summary: Run an endpoint's health check now
      description: >-
        Admin session with role >= `operator`. Performs the endpoint's TCP-connect
        check immediately (3 s timeout) and returns the refreshed endpoint. A
        background job also re-checks each `tcp` endpoint at most once a minute.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Endpoint with fresh `last_status`/`last_checked_at`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NodeEndpoint" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: "`endpoint_not_found`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "409":
          description: "`endpoint_check_disabled` - the endpoint's health_check is `none`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/nodes/{id}/join-token:
    post:
      tags: [Nodes]
      summary: Generate a one-time join token for a node
      description: >-
        Requires an admin session with role = `super_admin` (the highest-privilege
        node-management action, since a join token lets any holder register as
        that node's trusted agent). TTL is `NODE_AGENT_JOIN_TOKEN_TTL_MIN`
        (default 30 minutes).
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      security:
        - BearerAuth: []
      responses:
        "201":
          description: Token generated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  expires_at: { type: string, format: date-time, nullable: true }
                  unlimited: { type: boolean }
                  panel_addr:
                    type: string
                    nullable: true
                    description: >-
                      The exact host:port to give install-node.sh as the control-plane
                      address: the panel domain (falling back to the Host this request
                      was made on, for IP-only deployments) + NODE_AGENT_PORT. This is
                      NOT the panel's web/HTTPS port.
                    example: panel.example.com:48443
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/accounts:
    post:
      tags: [Accounts]
      summary: Create a WireGuard peer account
      description: >-
        Admin session (role >= `operator` - `support` is read-only everywhere)
        or API key with `create` permission. Generates a real WireGuard keypair
        server-side and gives the account a peer on every currently eligible
        node (status `registered`/`online`, node_group-restricted for a scoped
        API key) - not just one. Pass an explicit `node_id` to pin the account
        to a single node instead of the default fan-out. A node added to the
        fleet later automatically gets this account backfilled a peer too, the
        first time that node completes registration. See
        docs/STORY-09-multi-node-accounts.md for the full design.
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAccountRequest" }
      responses:
        "201":
          description: Account created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: >-
            Forbidden - either a `support`-role admin session, or an API key
            without `create` permission, or (`node_group_not_allowed`) an
            explicit `node_id` outside the API key's `node_groups` scope.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`node_not_registered` (an explicit `node_id` hasn't completed agent registration), `node_capacity_exceeded` (that one pinned node has no room), or `no_available_node` (no eligible node had room - the default fan-out only fails entirely when literally zero nodes could be provisioned; a single full node is skipped, not fatal), or `external_ref_taken`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "500": { $ref: "#/components/responses/InternalError" }
    get:
      tags: [Accounts]
      summary: List accounts
      description: >-
        Admin session (any role) or API key with `read` permission. API-key
        callers only ever see accounts under their own key's namespace
        (`owner_key_namespace`) - admins see every account. `limit` defaults to
        50, capped at 200.


        Accounts are ordered by `created_at`, then `id` (a stable tiebreak, so
        `limit`/`offset` paging never skips or repeats a row), and
        soft-deleted accounts (`status: deleted`) are left out.


        **Lookup by `external_ref`.** With a non-empty `external_ref` the
        response is the exact-match lookup instead: `{"accounts": [...]}`
        holding the one account in the caller's namespace whose `external_ref`
        equals the value, or an empty array when there is none. Unlike every
        other read it **includes** an account whose `status` is `deleted`:
        `external_ref` stays unique after a soft delete, so a deleted account
        still blocks re-using its ref (`409 external_ref_taken` on create) and
        this is how a client finds it. `limit`, `offset` and the staff-only
        `owner`/`reseller_id` filters are ignored in this mode. An
        `external_ref` held by an account in another namespace looks like no
        match (empty array) here, even though create would still answer
        `external_ref_taken`.
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 200, minimum: 1 }
        - name: offset
          in: query
          description: >-
            Number of accounts to skip, for paging with `limit`. Must be an
            integer >= 0 (default 0); anything else - negative, non-numeric,
            empty - is rejected with 400 `invalid_request` rather than silently
            read as 0. Ignored when `external_ref` is given.
          schema: { type: integer, minimum: 0, default: 0 }
        - name: cursor
          in: query
          description: >-
            Keyset (cursor) paging. Pass an empty value (`?cursor=`) for the
            first page, then the previous response's `next_cursor` until it is
            `null`. Cursor paging stays correct while accounts are created or
            deleted between requests, unlike `offset`. Mutually exclusive with
            `offset` (400 `invalid_request`); a malformed value is 400
            `invalid_cursor`. The `next_cursor` field only appears in cursor
            mode - the `limit`/`offset` response shape is unchanged.
          schema: { type: string }
        - name: external_ref
          in: query
          description: >-
            Exact-match lookup by `external_ref`, including a soft-deleted
            account (see the operation description). An empty value is treated
            as absent. Passing it makes `limit`/`offset` irrelevant.
          schema: { type: string }
        - name: owner
          in: query
          description: Staff admins only (ignored for resellers/API keys). `admin` = created by an admin; otherwise an exact owner namespace such as `reseller:<id>`.
          schema: { type: string }
        - name: reseller_id
          in: query
          description: Staff admins only. Shorthand for `owner=reseller:<id>`.
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  accounts:
                    type: array
                    items: { $ref: "#/components/schemas/Account" }
                  next_cursor:
                    type: string
                    nullable: true
                    description: Only present when `cursor` was passed. `null` on the last page.
        "400":
          description: "`invalid_request` - `offset` is not an integer >= 0, or both `cursor` and `offset` were given; `invalid_cursor` - malformed `cursor`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/accounts/bulk:
    post:
      tags: [Accounts]
      summary: Run one action over many accounts
      description: >-
        Admin session (role >= `operator`), reseller session, or API key. `action` picks
        the operation and the permission it needs, exactly as the single-account routes:
        `create` -> `create`; `renew`, `reset_usage` -> `update`; `suspend`, `enable` ->
        `suspend`; `delete` -> `delete`. At most 200 items per call. Every item runs the same
        store operation as its single-account endpoint - its own transaction and, for a
        reseller, its own limits-row lock - so `max_accounts`, the traffic credit, the plan
        expiry and namespace scoping apply item by item. The call returns 200 with one
        result per item whatever the outcome; a refused item has `ok: false` and an `error`
        (the same codes as the single route, plus `duplicate_id`). A `create` batch stops
        early once a reseller limit is hit and reports the remaining items as failed with
        that code. Each successful item is audit-logged with `bulk: true`.
        `reset_usage` is refused per item (`reseller_reset_not_allowed`) for a reseller that
        has a traffic credit. Whole-request problems (unknown action, bad count, no ids,
        batch too large) are 400.
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BulkAccountsRequest" }
      responses:
        "200":
          description: Per-item results.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BulkAccountsResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/templates:
    get:
      tags: [Templates]
      summary: List plan templates
      description: >-
        Staff see every template. A reseller or API key sees its own templates plus
        global ones flagged `available_to_resellers`.
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      responses:
        "200":
          description: Templates, ordered by name.
          content:
            application/json:
              schema:
                type: object
                properties:
                  templates:
                    type: array
                    items: { $ref: "#/components/schemas/PlanTemplate" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Templates]
      summary: Create a plan template
      description: >-
        Admin session (role >= `operator`), reseller session, or API key with `create`
        permission. A staff-created template is global; any other caller's template lives in
        its own namespace (and `available_to_resellers` is ignored).
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TemplateRequest" }
      responses:
        "201":
          description: Template created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanTemplate" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/templates/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Templates]
      summary: Get a plan template
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      responses:
        "200":
          description: The template.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanTemplate" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Templates]
      summary: Replace a plan template
      description: >-
        Replaces every editable field. Staff may edit any template; everyone else only their
        own (404 otherwise, including for a shared staff template). Existing accounts are
        unaffected - they copy template values at creation.
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TemplateRequest" }
      responses:
        "200":
          description: Template updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanTemplate" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Templates]
      summary: Delete a plan template
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/accounts/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Accounts]
      summary: Get an account by id
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    patch:
      tags: [Accounts]
      summary: Update mutable account fields
      description: >-
        Admin session (role >= `operator`) or API key with `update` permission.
        All fields optional; only provided fields change. An omitted (or
        `null`) `data_quota_gb`/`device_limit` means "leave unchanged", so
        removing a limit - making the account unlimited - takes the explicit
        `clear_data_quota` / `clear_device_limit` flags.


        **Moving the data cap takes effect at once** (see the Accounts tag for
        the rule). Setting `data_quota_gb` above the account's current
        `data_used_bytes` on an account suspended for `quota_exceeded`
        reactivates it (`status: active`, `suspend_reason: null`) unless it has
        expired (an `expiry_at` sent in the same request counts); setting it to
        the usage or below on an active account suspends it as
        `quota_exceeded` (`expired` instead if it is past its expiry). The
        returned account already reflects this. A PATCH that does not touch the
        quota never lifts a suspension, and `manual` / `abuse_flag` /
        `device_limit` / `expired` / `reseller_suspended` suspensions are never
        lifted by a quota change.
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label: { type: string }
                data_quota_gb:
                  type: number
                  nullable: true
                  description: >-
                    New data quota in GB (decimal, 1 GB = 10^9 bytes). Null/omitted = unchanged. A value at or
                    below the current usage suspends an active account; a value above it reactivates a
                    `quota_exceeded` one (see the operation description).
                clear_data_quota:
                  type: boolean
                  description: >-
                    `true` sets `data_quota_bytes` to null (unlimited).
                    Combining it with a non-null `data_quota_gb` is a 400
                    `invalid_request`; `false`/absent has no effect. A reseller
                    that has a data credit may not make an account unlimited:
                    422 `reseller_unlimited_not_allowed` (the same rule as on
                    create). If the account is suspended with reason
                    `quota_exceeded` and has not expired, clearing its quota
                    also reactivates it (it can no longer be over quota); any
                    other suspension reason is left alone. Usage
                    (`data_used_bytes`) is not touched.
                expiry_at: { type: string, format: date-time, nullable: true }
                device_limit: { type: integer, nullable: true }
                reset_strategy:
                  type: string
                  enum: [none, day, week, month, year]
                  description: Scheduled usage reset; setting it restarts the schedule from now (`none` clears `next_reset_at`).
                hold_duration_days:
                  type: integer
                  minimum: 1
                  description: Changes the validity of an account that is still on hold (ignored once active). Setting `expiry_at` on an on-hold account instead activates it with that fixed date.
                clear_device_limit:
                  type: boolean
                  description: >-
                    `true` sets `device_limit` to null (unlimited) and clears
                    the standing `device_limit_exceeded` flag. Combining it with
                    a non-null `device_limit` is a 400 `invalid_request`;
                    `false`/absent has no effect. A `device_limit` suspension is
                    not lifted by this.
                bandwidth_limit_mbps:
                  type: integer
                  nullable: true
                  description: 0 removes the limit (unshaped); omitted = unchanged; 1-100000 sets the rate in Mbps.
                device_limit_hard_enforce:
                  type: boolean
                  description: Toggle auto-suspend on device-limit breach (PRD-account-management.md §6.4).
      responses:
        "200":
          description: Updated account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "400":
          description: >-
            `invalid_request` - malformed body, a negative quota, or
            `clear_data_quota` / `clear_device_limit` sent together with a
            value for the same field.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Reseller limit - `reseller_data_credit_exceeded`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "422":
          description: >-
            Reseller limit - `reseller_unlimited_not_allowed` (`clear_data_quota`
            for a reseller with a data credit), `reseller_expiry_too_long` or
            `reseller_expiry_required`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      tags: [Accounts]
      summary: Soft-delete an account
      description: >-
        Admin session (role >= `operator`) or API key with `delete` permission.
        Returns the soft-deleted account record (status becomes `deleted`), not
        an empty 204 - the assigned IP is released after a grace period
        (`ip_release_at`), not immediately, to avoid immediate reuse collisions.
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      responses:
        "200":
          description: Account soft-deleted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/accounts/{id}/suspend:
    post:
      tags: [Accounts]
      summary: Suspend an account
      description: Admin session (role >= `operator`) or API key with `suspend` permission.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  enum: [manual, abuse_flag]
                  default: manual
                  description: Any other value is silently coerced to "manual".
      responses:
        "200":
          description: Account suspended.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/accounts/{id}/enable:
    post:
      tags: [Accounts]
      summary: Re-enable a suspended account
      description: >-
        Admin session (role >= `operator`) or API key with `suspend` permission
        (enable shares the suspend permission, not a separate one).


        An account that has used its whole data quota (`data_used_bytes >=
        data_quota_bytes`) cannot be enabled, whatever its suspension reason:
        the next traffic sample would suspend it again as `quota_exceeded`, so
        the call answers `409 quota_exhausted` and changes nothing. Raise the
        quota (`PATCH`), renew with `add_quota_gb` or `reset-usage` first (the
        first and last reactivate a `quota_exceeded` account by themselves);
        enabling works as before once the quota is above the usage, and always
        for an unlimited account.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      responses:
        "200":
          description: Account enabled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >-
            `quota_exhausted` - the account is at or over its data quota, so
            enabling it would be undone by the next sample (see the operation
            description).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/accounts/{id}/renew:
    post:
      tags: [Accounts]
      summary: Extend an account's quota and/or expiry
      description: >-
        Admin session (role >= `operator`) or API key with `update` permission.
        Reactivates the account if it was suspended solely for `quota_exceeded`
        or `expired` and the new numbers resolve that: for `quota_exceeded` the
        quota must now be above the usage **and** the account must not be
        expired (`add_quota_gb` alone never revives an expired account); for
        `expired` the new expiry must be in the future. A renewal that leaves
        the account at or over its data cap (a validity-only renewal of an
        expired account that has also used all its data, or a negative
        `add_quota_gb` that takes the quota to the usage or below) leaves or
        puts it in `suspended` / `quota_exceeded`. `manual` / `abuse_flag`
        suspensions are never lifted.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                add_quota_gb:
                  type: number
                  nullable: true
                  description: Added on top of the existing quota (not a replacement).
                extend_days:
                  type: integer
                  nullable: true
                  description: >-
                    Extends from the current expiry_at (or from now, if the account has none/has already expired).
                    For an account still **on hold** the clock has not started, so this lengthens its
                    `hold_duration_days` instead and `expiry_at` stays null.
      responses:
        "200":
          description: Account renewed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/accounts/{id}/reset-usage:
    post:
      tags: [Accounts]
      summary: Reset an account's data usage to zero
      description: >-
        Admin session (role >= `operator`) or API key with `update` permission
        - the same protection as renew. Takes no body (an empty body or `{}`).
        Not available to a reseller's own panel session, and refused with 403
        `reseller_reset_not_allowed` for a reseller-owned API key whose reseller
        has a traffic credit (the credit counts quota handed out, so a reset
        would re-sell it; such a reseller renews with `add_quota_gb`).


        In one transaction: `data_used_bytes` becomes 0, and if the account is
        `suspended` with `suspend_reason: quota_exceeded` and has not expired
        (`expiry_at` null or in the future) it is reactivated
        (`status: active`, `suspend_reason: null`); node agents pick it back up
        on their next heartbeat, exactly as after `POST .../enable`. No other
        suspension reason is ever lifted (`manual`, `abuse_flag`, `expired`,
        `device_limit`, `reseller_suspended`), and the quota
        (`data_quota_bytes`) is not changed. Traffic sampling carries on from
        the nodes' own counters, so the next sample adds only new traffic;
        recorded usage history (charts, reports) is kept. Audit log action:
        `account.usage_reset`.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: Usage reset; the updated account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: "`forbidden` (role or permission), or `reseller_reset_not_allowed` - a reseller-owned key whose reseller has a traffic credit."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "404":
          description: "`account_not_found` - no such account, a soft-deleted one, or one outside the caller's namespace."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/accounts/{id}/config:
    get:
      tags: [Accounts]
      summary: Fetch the account's wg-quick configuration file for one of its node peers
      description: >-
        Returns `text/plain`, not JSON - a ready-to-import wg-quick config
        including the account's real (decrypted) private key. An account can
        have a peer on several nodes (see the `Account.peers` field) - `node_id`
        picks which one. If omitted and the account has exactly one peer, that
        peer is used by default; if it has more than one, this 400s with the
        list of valid node ids instead of guessing. Admin session (any role)
        or API key with `read` permission.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: node_id
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: Required if the account has peers on more than one node; optional (defaults to the only peer) otherwise.
        - name: endpoint_id
          in: query
          required: false
          schema: { type: string, description: "A node endpoint id, or the literal `direct` for the node's public_endpoint." }
          description: >-
            Staff admin sessions only (403 `forbidden` for resellers and API
            keys). Renders the config for that specific entry endpoint of the
            node, even if it is disabled or down. Without it the highest-priority
            enabled, healthy node endpoint is used, falling back to the node's
            `public_endpoint`. The `MTU` line is the endpoint's own `mtu` if set,
            else the panel's `client_mtu` setting.
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      responses:
        "200":
          description: wg-quick config text.
          content:
            text/plain:
              schema:
                type: string
                example: |
                  [Interface]
                  PrivateKey = <account private key>
                  Address = 10.66.0.4/32

                  [Peer]
                  PublicKey = <node public key>
                  Endpoint = vpn1.example.com:51820
                  AllowedIPs = 0.0.0.0/0
                  PersistentKeepalive = 25
        "400":
          description: "`node_id_required` - the account has peers on multiple nodes and `node_id` was omitted; the message lists the valid ids."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: "`account_not_found`, `node_not_found` if `node_id` doesn't match any of this account's peers, or `endpoint_not_found` if `endpoint_id` isn't an endpoint of that node."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "409":
          description: "`no_peers` (this account has no node peers yet) or `node_missing_public_key` (the target node has no WireGuard public key recorded yet)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/accounts/{id}/devices:
    get:
      tags: [Accounts]
      summary: List distinct client devices observed for this account
      description: >-
        Device tracking per PRD-account-management.md §6.4 - a "device" is a
        distinct source endpoint (IP:port) reported by node agents from live
        WireGuard handshakes. `active` = handshaked within the rolling 5-minute
        window, the same definition device-limit enforcement uses. Rows unseen
        for 30 days are pruned. Admin session (any role) or API key with `read`
        permission.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  devices:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        source_endpoint: { type: string, example: "203.0.113.7:51843" }
                        node_id: { type: string, format: uuid }
                        node_name: { type: string }
                        first_seen_at: { type: string, format: date-time }
                        last_seen_at: { type: string, format: date-time }
                        active: { type: boolean }
                  active_devices: { type: integer }
                  device_limit: { type: integer, nullable: true }
                  device_limit_exceeded: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/accounts/{id}/steer:
    get:
      tags: [Accounts]
      summary: Rank this account's nodes, best connection choice first
      description: >-
        Smart node steering - scores every node the account has a peer on by
        current load (active peers / capacity) and recent average CPU, with
        online nodes always ahead of offline ones and `?region=` matches ahead
        of the rest. Exactly one entry is `recommended`. This is the same engine
        the subscription endpoint uses for its default node choice. Admin
        session (any role) or API key with `read` permission.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: region
          in: query
          required: false
          schema: { type: string }
          description: Prefer nodes whose region label matches (case-insensitive).
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      responses:
        "200":
          description: Nodes ranked best-first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  nodes:
                    type: array
                    items:
                      type: object
                      properties:
                        node_id: { type: string, format: uuid }
                        name: { type: string }
                        region: { type: string }
                        public_endpoint: { type: string }
                        online: { type: boolean }
                        active_peers: { type: integer }
                        capacity: { type: integer }
                        cpu_percent: { type: number, nullable: true, description: Recent average; null when the node has no samples in the window. }
                        score: { type: number, description: Composite load/CPU score - lower is better. }
                        region_match: { type: boolean }
                        recommended: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/accounts/{id}/subscription/rotate:
    post:
      tags: [Accounts]
      summary: Rotate the account's subscription URL
      description: >-
        Replaces the subscription token immediately - the old URL stops working,
        the response carries the account with its new `subscription_path`. The
        WireGuard keypair is untouched (existing device tunnels keep working;
        only the config-fetch URL changes). Admin session (role >= `operator`)
        or API key with `update` permission.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      responses:
        "200":
          description: Account with the new subscription_path.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/sub/{token}:
    get:
      tags: [Subscription]
      summary: Fetch the account's current wg-quick config via its subscription URL
      description: >-
        Unauthenticated by design - the 192-bit random token in the path is the
        credential (capability URL), suitable for pasting into client apps that
        poll for their latest config. By default the best node is chosen by the
        steering engine; `?node_id=` pins one, `?region=` biases the choice.
        Suspended/expired accounts get 403 `account_suspended` rather than a
        config that would silently fail to handshake. The token never appears
        in access logs (redacted by the logging middleware).


        **Content negotiation.** A browser navigation (an `Accept` header that
        lists `text/html`) is answered with `302` to `/s/{token}` on the same
        origin - the public customer page, see `GET /api/v1/sub/{token}/info`.
        Clients, bots and curl (no `Accept`, `*/*`, anything else) keep getting
        the config exactly as before; `?format=conf` forces the config even for
        a browser (the page's download button uses it). The config's `Endpoint`
        is the best healthy node endpoint (relay) or the node's
        `public_endpoint`; its `MTU` follows the `client_mtu` setting.
        Rate limited per client IP (429 `rate_limited`).
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
        - name: format
          in: query
          required: false
          schema: { type: string, enum: [conf] }
          description: Force the config response (skip the browser redirect).
        - name: node_id
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: region
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: >-
            wg-quick config text (Content-Disposition attachment). Served as
            `application/octet-stream` rather than `text/plain` so Android
            Chrome keeps the `.conf` extension instead of renaming the
            download to `.conf.txt`, which the WireGuard app can't import.
          content:
            application/octet-stream:
              schema: { type: string }
        "302":
          description: Browser navigation - redirect to the public page `/s/{token}` (same origin).
          headers:
            Location: { schema: { type: string, example: "/s/<token>" } }
        "403":
          description: "`account_suspended`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "404":
          description: Unknown token, or `node_not_found` for an explicit `node_id` the account has no peer on.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "409":
          description: "`no_peers` or `node_missing_public_key`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/sub/{token}/info:
    get:
      tags: [Subscription]
      summary: Account status for the public subscription page
      description: >-
        Feeds the customer-facing page at `/s/{token}` (mobile-first, Persian by
        default with an English toggle): status, used/total traffic, days left,
        active devices, support contact and the config/node download paths.
        Unauthenticated - the token is the credential, and the response contains
        only that one account's data (no ids, no token, no peer IPs, no device
        endpoints). Unlike the config endpoint it also answers for a suspended
        account, so the page can say why the link stopped working. Never cached.
        Rate limited per client IP.
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubscriptionInfo" }
        "404":
          description: Unknown token (or a deleted account).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/sub/{token}/nodes:
    get:
      tags: [Subscription]
      summary: List the nodes available to this subscription, steering-ranked
      description: >-
        The machine-readable companion to the config endpoint, for client apps
        that want to offer a node picker. Same token-as-credential model; each
        entry carries a ready-to-fetch `config_path`.
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
        - name: region
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Nodes ranked best-first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  nodes:
                    type: array
                    items:
                      type: object
                      properties:
                        node_id: { type: string, format: uuid }
                        name: { type: string }
                        region: { type: string }
                        online: { type: boolean }
                        recommended: { type: boolean }
                        config_path: { type: string, example: "/api/v1/sub/<token>?node_id=<uuid>" }
        "403":
          description: "`account_suspended`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "404":
          description: Unknown token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/api-keys:
    post:
      tags: [API Keys]
      summary: Create a bot/reseller API key
      description: >-
        Requires an admin session with role = `super_admin`, or a `reseller` session.
        A key created by a reseller is owned by it (`reseller_id` set): it acts inside
        the reseller's namespace, is subject to the reseller's quotas, and its
        `node_groups` must be a subset of the reseller's (else 422
        `reseller_node_group_not_allowed`; empty = inherit the reseller's). Resellers
        list/revoke/rotate only their own keys (404 otherwise); super_admin sees all.
        The response's `secret` field is shown **exactly once** - it cannot be retrieved again,
        only rotated (which invalidates it after a 24h grace period).
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label]
              properties:
                label: { type: string }
                node_groups:
                  type: array
                  items: { type: string }
                  description: Empty/omitted = unrestricted (all node groups).
                permissions:
                  type: array
                  items:
                    type: string
                    enum: [read, create, update, suspend, delete, webhooks]
      responses:
        "201":
          description: Key created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiKeyCreated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: "`key_id_collision` - vanishingly rare random-id collision; safe to retry."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "500": { $ref: "#/components/responses/InternalError" }
    get:
      tags: [API Keys]
      summary: List API keys
      description: Requires an admin session with role = `super_admin`. Never includes secrets.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  api_keys:
                    type: array
                    items: { $ref: "#/components/schemas/ApiKey" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/api-keys/{id}/revoke:
    post:
      tags: [API Keys]
      summary: Revoke an API key immediately
      description: Requires an admin session with role = `super_admin`. No grace period - unlike rotation, revocation is immediate.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Revoked.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: revoked }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/api-keys/{id}/rotate:
    post:
      tags: [API Keys]
      summary: Rotate an API key's secret
      description: >-
        Requires an admin session with role = `super_admin`. The old secret
        remains valid for a 24-hour grace period (so in-flight bot deployments
        don't break instantly), then only the new secret works. The new secret
        is shown **exactly once**, in this response.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Rotated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiKeyCreated" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/admins:
    post:
      tags: [Admin Users]
      summary: Create an admin/operator/support user
      description: Requires an admin session with role = `super_admin`.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
                role:
                  type: string
                  enum: [super_admin, operator, support]
                  default: support
                  description: "`reseller` is not accepted here; use POST /api/v1/resellers. Resellers are hidden from GET /admins and rejected by PATCH/DELETE /admins/{id} (409 managed_via_resellers)."
      responses:
        "201":
          description: Admin created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminCreateResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Username already taken.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "500": { $ref: "#/components/responses/InternalError" }
    get:
      tags: [Admin Users]
      summary: List admin users
      description: Requires an admin session with role = `super_admin`. Never includes password hashes.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  admins:
                    type: array
                    items: { $ref: "#/components/schemas/AdminUser" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/me:
    get:
      tags: [Resellers]
      summary: Who am I (any admin session)
      description: >-
        Returns the logged-in admin's id, username and role. `role` is also the `role`
        claim of the JWT. For a `reseller` session `reseller` carries its limits and
        live usage; otherwise it is null.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Current user.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  username: { type: string }
                  role: { type: string, enum: [super_admin, operator, support, reseller] }
                  reseller:
                    nullable: true
                    allOf: [{ $ref: "#/components/schemas/Reseller" }]
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/reseller/me:
    get:
      tags: [Resellers]
      summary: A reseller's own limits and usage
      description: Reseller sessions only (403 for anyone else).
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Limits and usage.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reseller" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/resellers:
    get:
      tags: [Resellers]
      summary: List resellers with limits and usage
      description: Requires role `super_admin`.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Resellers.
          content:
            application/json:
              schema:
                type: object
                properties:
                  resellers:
                    type: array
                    items: { $ref: "#/components/schemas/Reseller" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Resellers]
      summary: Create a reseller
      description: Requires role `super_admin`. Omitted/null limits are unlimited; empty `node_groups` means all groups.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password, minLength: 8 }
                notes: { type: string }
                disabled: { type: boolean }
                max_accounts: { type: integer, nullable: true, minimum: 0 }
                data_limit_gb: { type: number, nullable: true, minimum: 0 }
                node_groups: { type: array, items: { type: string } }
                expires_at: { type: string, format: date-time, nullable: true, description: "Plan end date; must be in the future. Omit or null = never expires." }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reseller" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: "`username_taken`." }

  /api/v1/resellers/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Resellers]
      summary: Get a reseller
      description: Requires role `super_admin`.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Reseller.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reseller" }
        "404": { description: "`reseller_not_found`." }
    patch:
      tags: [Resellers]
      summary: Update limits, notes, disabled flag or password
      description: >-
        Requires role `super_admin`. Omitted fields are unchanged; an explicit `null`
        on `max_accounts`/`data_limit_gb` means unlimited and on `expires_at` means never expires. Lowering a
        limit below current usage is allowed (blocks growth only). Disabling takes
        effect on the reseller's next request.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password: { type: string, format: password, minLength: 8 }
                notes: { type: string }
                disabled: { type: boolean }
                max_accounts: { type: integer, nullable: true }
                data_limit_gb: { type: number, nullable: true }
                node_groups: { type: array, items: { type: string } }
                expires_at: { type: string, format: date-time, nullable: true, description: "Explicit null = never expires; omitted = unchanged." }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reseller" }
        "404": { description: "`reseller_not_found`." }
    delete:
      tags: [Resellers]
      summary: Delete a reseller
      description: Requires role `super_admin`. Refused with 409 `reseller_has_accounts` while it owns non-deleted accounts.
      security:
        - BearerAuth: []
      responses:
        "204": { description: Deleted. }
        "404": { description: "`reseller_not_found`." }
        "409": { description: "`reseller_has_accounts`." }

  /api/v1/resellers/{id}/suspend-accounts:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Resellers]
      summary: Suspend all of a reseller's active accounts
      description: Requires role `super_admin`. Sets `suspend_reason = reseller_suspended`; the reseller cannot re-enable these.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Count suspended.
          content:
            application/json:
              schema:
                type: object
                properties:
                  suspended: { type: integer }
                  reason: { type: string, example: reseller_suspended }
        "404": { description: "`reseller_not_found`." }

  /api/v1/resellers/{id}/reactivate-accounts:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Resellers]
      summary: Reactivate accounts suspended by the bulk action
      description: >-
        Requires role `super_admin`. Touches only `reseller_suspended` accounts; one that
        has since expired or exhausted its quota stays suspended with the real reason
        and is counted in `still_suspended`.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Counts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  reactivated: { type: integer }
                  still_suspended: { type: integer }
        "404": { description: "`reseller_not_found`." }

  /api/v1/reports:
    get:
      tags: [Reports]
      summary: Reporting dashboard data
      description: >-
        One payload for the reports page. Hourly buckets (24h, 7d) come from raw samples;
        daily buckets (30d, 90d, 365d) from the `traffic_daily` continuous aggregate.
        Series are gap-free and evenly spaced (missing buckets are zero); the last bucket
        is the current, partial one. Resellers (session or reseller-owned key) and plain
        API keys are always scoped to their own namespace and `reseller_id`/`owner` are
        ignored for them. Staff may narrow with `reseller_id` or `owner`. `nodes[].cpu_avg`
        and `mem_avg_percent` are null unless the caller is staff; `resellers` is present
        only for a super_admin with no scope filter, otherwise null.
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: range
          in: query
          schema: { type: string, enum: ["24h", "7d", "30d", "90d", "365d"], default: "7d" }
        - name: reseller_id
          in: query
          description: Staff only. Scope to one reseller.
          schema: { type: string, format: uuid }
        - name: owner
          in: query
          description: Staff only. `admin` = staff-created accounts, or an exact owner namespace.
          schema: { type: string }
      responses:
        "200":
          description: Report.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Report" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/audit-log:
    get:
      tags: [Audit Log]
      summary: List recent audit log entries, newest first
      description: Requires an admin session with role = `super_admin`.
      security:
        - BearerAuth: []
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 50 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items: { $ref: "#/components/schemas/AuditLogEntry" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /agent/preflight:
    servers:
      - url: https://node-agent.internal:48443
    post:
      tags: [Node Agent]
      summary: Look up a join token's node and expected WireGuard settings without redeeming it
      description: >-
        Called by install-node.sh before the agent starts, so the installer can
        take the node's WireGuard listen port and interface address from the
        panel instead of asking for values that must match it exactly. Same
        credential and validity rules as `/agent/register` (the join token), but
        the token is NOT redeemed. No client certificate required.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [join_token]
              properties:
                join_token: { type: string }
      responses:
        "200":
          description: The token is valid; the node it would register.
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      node_id: { type: string, format: uuid }
                      name: { type: string }
                  - $ref: "#/components/schemas/NodeNetwork"
        "400":
          description: "`invalid_request` - join_token missing."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "401":
          description: "`invalid_token` - join token invalid, expired, or already used."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "500": { $ref: "#/components/responses/InternalError" }

  /agent/register:
    servers:
      - url: https://node-agent.internal:48443
    post:
      tags: [Node Agent]
      summary: Redeem a join token for an mTLS client certificate
      description: >-
        Called by `cmd/agent` on first startup. No client certificate is
        required for this call (it's how the node gets one) - the `join_token`
        field is the sole credential, single-use, redeemed atomically. The
        returned certificate's Common Name is always the server-assigned node
        ID; the CSR's own requested Subject/CN is ignored, so a compromised or
        buggy agent can never claim a different node's identity.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [join_token, csr_pem]
              properties:
                join_token: { type: string }
                csr_pem:
                  type: string
                  description: PEM-encoded PKCS#10 certificate signing request, generated locally by the agent (its private key never leaves the node).
                wg_public_key:
                  type: string
                  description: This node's own WireGuard server public key, if install-node.sh already created a real wg0 interface. Optional.
      responses:
        "201":
          description: Registered. Store the certificate and CA alongside the agent's private key for all future mTLS calls.
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      node_id: { type: string, format: uuid }
                      certificate_pem: { type: string }
                      ca_certificate_pem: { type: string }
                  - $ref: "#/components/schemas/NodeNetwork"
        "400":
          description: "`invalid_request` (missing fields) or `invalid_csr` (CSR could not be parsed/signed)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "401":
          description: "`invalid_token` - join token invalid, expired, or already used."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "500": { $ref: "#/components/responses/InternalError" }

  /agent/heartbeat:
    servers:
      - url: https://node-agent.internal:48443
    post:
      tags: [Node Agent]
      summary: Report liveness and peer count
      description: >-
        Called every 10 seconds by `cmd/agent`. **Requires a client certificate**
        issued by a prior `/agent/register` call - enforced at the TLS layer
        (connection-level) and again in-handler (the cert's Subject CN is
        looked up as the node ID, and its fingerprint must match what was
        pinned at registration, so a stale-but-still-CA-signed cert from a
        node that re-registered is correctly rejected). This requirement
        cannot be expressed as an OpenAPI security scheme in 3.0 - treat it as
        a hard transport-level precondition, not optional.
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                peer_count: { type: integer }
                load_avg: { type: number }
                dns_forwarder:
                  type: boolean
                  description: The agent serves DNS for its clients on the node's tunnel address (see client_dns = node).
                obfuscation:
                  type: object
                  description: What the agent actually runs (mode + applied profile revision); the panel hands out AWG configs only when this matches the assigned profile.
                  properties:
                    mode: { type: string, enum: [wireguard, awg] }
                    profile_id: { type: string, format: uuid }
                    revision: { type: integer }
                    supported: { type: boolean }
                    error: { type: string }
              description: Informational only - malformed/absent bodies are tolerated, not rejected.
      responses:
        "200":
          description: Heartbeat recorded; node status set to `online`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  client_dns:
                    type: string
                    description: The resolved DNS = value this node's clients get; the agent probes it from the node.
                  network:
                    $ref: "#/components/schemas/NodeNetwork"
                    description: >-
                      The node's expected WireGuard settings, so agents registered before
                      `/agent/register` returned them can check their interface too.
                  obfuscation:
                    type: object
                    description: >-
                      The AmneziaWG profile to run (`profile` is null for plain WireGuard).
                      Parameter changes apply live where AWG allows it, otherwise the
                      agent recreates the interface.
                    properties:
                      profile:
                        type: object
                        nullable: true
                        properties:
                          id: { type: string, format: uuid }
                          revision: { type: integer }
                          compat: { type: string, enum: [awg1, awg2] }
                          params: { $ref: "#/components/schemas/ObfuscationParams" }
        "401":
          description: "`client_certificate_required` (no client cert presented) or `certificate_superseded` (cert's fingerprint no longer matches this node's pinned identity)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "404":
          description: "`node_not_found` - certificate's Common Name doesn't match any known node."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/settings:
    get:
      tags: [Settings]
      summary: Get panel-wide settings
      description: Readable by any admin role (including `support`) - this is configuration display, not a mutating action.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }
    patch:
      tags: [Settings]
      summary: Update panel-wide settings
      description: >-
        Requires an admin session with role = `super_admin` - these are panel-wide
        defaults, the same trust tier as API keys and join tokens. Omitted fields are
        left unchanged (same PATCH convention as `PATCH /api/v1/accounts/{id}` - a
        nullable field can be set this way but not explicitly cleared back to null,
        with two exceptions: sub_domain "" and sub_port 0 explicitly clear those).
        Including panel_domain, sub_domain or sub_port also pushes the new domain
        config to Caddy live - see domain_live_applied/domain_apply_error on the
        response.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Settings" }
      responses:
        "200":
          description: Updated settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettingsUpdateResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/backup:
    post:
      tags: [Backup]
      summary: Download a full, password-encrypted panel backup
      description: >-
        Requires role = `super_admin`. POST (not GET) because the encryption
        password rides in the body. Streams a JSON attachment: an argon2id +
        AES-256-GCM envelope sealing every config table (admins, nodes, accounts,
        account_peers, account_devices, api_keys, panel_settings, audit_log), the
        node-mTLS CA keypair, and the deployment's ACCOUNT_KEY_ENCRYPTION_KEY /
        API_HMAC_MASTER_KEY - so the file plus its password is sufficient to
        rebuild the panel on a brand-new server with a fresh deploy/.env. Metrics
        history (TimescaleDB hypertables) is excluded - account usage totals live
        on the accounts rows and are included. The password is the only way to
        open the file and cannot be recovered.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, minLength: 8 }
      responses:
        "200":
          description: The encrypted backup file (Content-Disposition attachment).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupEnvelope" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/backup/restore:
    post:
      tags: [Backup]
      summary: Replace ALL panel state with an uploaded backup
      description: >-
        Requires role = `super_admin`. Atomically replaces the contents of every
        backed-up table with the file's rows (a table absent from the file is
        emptied, not skipped) and writes the CA keypair to disk - if that keypair
        differs from the running one, node-agent mTLS needs an api restart to pick
        it up (`restart_required` on the response). If this deployment's
        ACCOUNT_KEY_ENCRYPTION_KEY / API_HMAC_MASTER_KEY differ from the ones
        embedded in the backup (disaster recovery onto a fresh .env), every
        account private key and API-key secret is transparently re-encrypted to
        the current keys. Validated before anything is touched: the password must
        open the envelope (`wrong_password`) and the file's schema version must
        exactly match this panel's (`schema_mismatch`). Restoring replaces admin
        users too - the caller's own login may change.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, backup]
              properties:
                password: { type: string }
                backup: { $ref: "#/components/schemas/BackupEnvelope" }
      responses:
        "200":
          description: Restore succeeded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RestoreResult" }
        "400":
          description: "`invalid_request` or `wrong_password` - nothing was changed."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: "`schema_mismatch` - nothing was changed."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "413":
          description: Backup file exceeds the 256MB limit.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "500": { $ref: "#/components/responses/InternalError" }


  # ---- Notifications, webhooks and scheduled backups ----------------------------

  /api/v1/notifications:
    get:
      tags: [Notifications]
      summary: In-panel notification center
      description: >-
        Newest notifications visible to the caller, with the caller's read state.
        Staff see every event; a reseller sees only events of its own namespace.
        `broken_channels` (staff only) counts enabled notification channels that
        failed 3 deliveries in a row, for the "channel broken" banner.
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 30 } }
        - { name: unread, in: query, schema: { type: boolean } }
      responses:
        "200":
          description: Notifications.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer, format: int64 }
                        event: { type: string, example: node.down }
                        severity: { type: string, enum: [info, warning, critical] }
                        title: { type: string }
                        body: { type: string }
                        data: { type: object, additionalProperties: true }
                        read: { type: boolean }
                        created_at: { type: string, format: date-time }
                  unread_count: { type: integer }
                  broken_channels: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/notifications/read-all:
    post:
      tags: [Notifications]
      summary: Mark every notification as read for the caller
      security: [{ BearerAuth: [] }]
      responses:
        "204": { description: Done. }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/notifications/{id}/read:
    post:
      tags: [Notifications]
      summary: Mark one notification as read
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "204": { description: Done. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: "`notification_not_found` - no such notification, or not visible to the caller." }

  /api/v1/notification-channels:
    get:
      tags: [Notifications]
      summary: List notification channels (Telegram / email)
      description: >-
        Requires role = `super_admin`. Bot tokens and SMTP passwords are stored
        encrypted and never returned (`has_secret` only). `events` is the list of
        subscribable event types.
      security: [{ BearerAuth: [] }]
      responses:
        "200":
          description: Channels.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/NotificationChannel" } }
                  events: { type: array, items: { type: string } }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Notifications]
      summary: Create a notification channel
      description: >-
        `config` for `telegram` is `{chat_ids: [string]}` with the bot token in
        `secret`; for `email` it is `{host, port, username, from, to: [string],
        tls: starttls|tls|none}` with the SMTP password in `secret`. An empty
        `events` list subscribes the channel to nothing. `lang` selects the message
        language (`en` or `fa`).
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationChannelWrite" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationChannel" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/notification-channels/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [Notifications]
      summary: Update a notification channel
      description: >-
        Omitted fields are unchanged; an omitted or empty `secret` keeps the stored
        one. Saving clears the channel's failure streak.
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationChannelWrite" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationChannel" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { description: "`channel_not_found`." }
    delete:
      tags: [Notifications]
      summary: Delete a notification channel
      security: [{ BearerAuth: [] }]
      responses:
        "204": { description: Deleted. }
        "404": { description: "`channel_not_found`." }

  /api/v1/notification-channels/{id}/test:
    post:
      tags: [Notifications]
      summary: Send a test message through a channel
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Delivered. }
        "404": { description: "`channel_not_found`." }
        "502": { description: "`channel_test_failed` - the message states why delivery failed (credentials are never included)." }

  /api/v1/webhooks:
    get:
      tags: [Webhooks]
      summary: List webhook endpoints
      description: >-
        Staff see every endpoint (global ones have `namespace: null`); a reseller
        sees only its own. The signing secret is never listed.
      security: [{ BearerAuth: [] }, { ApiKeyAuth: [] }]
      responses:
        "200":
          description: Webhooks.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Webhook" } }
                  events: { type: array, items: { type: string } }
    post:
      tags: [Webhooks]
      summary: Register a webhook endpoint
      description: >-
        Requires role >= `operator`, a reseller session, or an API key with the
        `webhooks` permission. Staff-created endpoints are global (all namespaces);
        reseller- and API-key-created ones receive only their own namespace's
        events (`account.*`, `reseller.*`) - for a key, the events of the accounts
        it created, so a sales bot can register its own endpoint. Account events
        carry `account_id`, `label` and, when the account has one, `external_ref`. The response is the only
        time the signing `secret` is shown. Each delivery is a JSON POST signed with
        `X-Jirjirak-Signature: t=<unix>,v1=<hex>` where `v1` is the hex
        HMAC-SHA256 of `<t>.<raw body>` keyed with the secret; also sent are
        `X-Jirjirak-Event` and `X-Jirjirak-Delivery`. A non-2xx answer or a timeout
        (10 s) is retried after 1 min, 5 min, 30 min, 2 h and 6 h, then marked
        `failed`. Targets resolving to private, loopback, link-local or metadata
        addresses are refused (`webhook_url_blocked`) unless a super_admin enabled
        the override, which never applies to reseller endpoints.
      security: [{ BearerAuth: [] }, { ApiKeyAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebhookWrite" }
      responses:
        "201":
          description: Created; includes the one-time `secret`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Webhook" }
        "400": { description: "`invalid_request` or `webhook_url_blocked`." }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/webhooks/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [Webhooks]
      summary: Update a webhook endpoint (url, description, events, enabled)
      security: [{ BearerAuth: [] }, { ApiKeyAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebhookWrite" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Webhook" }
        "400": { description: "`invalid_request` or `webhook_url_blocked`." }
        "404": { description: "`webhook_not_found`." }
    delete:
      tags: [Webhooks]
      summary: Delete a webhook endpoint and its delivery log
      security: [{ BearerAuth: [] }, { ApiKeyAuth: [] }]
      responses:
        "204": { description: Deleted. }
        "404": { description: "`webhook_not_found`." }

  /api/v1/webhooks/{id}/rotate-secret:
    post:
      tags: [Webhooks]
      summary: Rotate the signing secret
      description: The previous secret stops working immediately. The new one is returned once.
      security: [{ BearerAuth: [] }, { ApiKeyAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Rotated; includes the one-time `secret`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Webhook" }
        "404": { description: "`webhook_not_found`." }

  /api/v1/webhooks/{id}/test:
    post:
      tags: [Webhooks]
      summary: Send a signed `ping` event now (no retries)
      security: [{ BearerAuth: [] }, { ApiKeyAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The resulting delivery (status code, latency, response excerpt).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookDelivery" }
        "404": { description: "`webhook_not_found`." }

  /api/v1/webhooks/{id}/deliveries:
    get:
      tags: [Webhooks]
      summary: Delivery log of a webhook (newest first)
      security: [{ BearerAuth: [] }, { ApiKeyAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200":
          description: Deliveries.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/WebhookDelivery" } }
        "404": { description: "`webhook_not_found`." }

  /api/v1/webhooks/{id}/deliveries/{delivery_id}/redeliver:
    post:
      tags: [Webhooks]
      summary: Queue a fresh delivery with the same payload
      security: [{ BearerAuth: [] }, { ApiKeyAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: delivery_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "202":
          description: Queued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookDelivery" }
        "404": { description: "`webhook_not_found` or `delivery_not_found`." }

  /api/v1/webhook-settings:
    get:
      tags: [Webhooks]
      summary: Webhook SSRF override setting
      description: Requires role >= `operator`.
      security: [{ BearerAuth: [] }]
      responses:
        "200":
          description: Current setting.
          content:
            application/json:
              schema: { type: object, properties: { allow_private_targets: { type: boolean } } }
    patch:
      tags: [Webhooks]
      summary: Allow staff-owned webhooks to reach private networks
      description: >-
        Requires role = `super_admin`. Off by default. Applies only to staff-owned
        (global) endpoints, never to reseller endpoints.
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [allow_private_targets]
              properties: { allow_private_targets: { type: boolean } }
      responses:
        "200": { description: Saved. }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/backup-schedule:
    get:
      tags: [Backup]
      summary: Scheduled off-box backup configuration and last results
      description: >-
        Requires role = `super_admin`. Secrets (backup password, Telegram token, S3
        secret key) are never returned (`has_*` flags only). `last` holds the newest
        result per destination (`telegram`, `s3`); `runs` the 20 newest.
      security: [{ BearerAuth: [] }]
      responses:
        "200":
          description: Schedule.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupSchedule" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [Backup]
      summary: Save the scheduled backup configuration
      description: >-
        Backups use the same password-encrypted envelope as `POST /api/v1/backup`,
        so they restore through the same path. Empty `password`, `telegram.bot_token`
        or `s3.secret_key` keep the stored value. Telegram documents are limited to
        50 MB by the Bot API - a larger backup fails with a clear message and should
        go to S3. S3 works with AWS, MinIO and ArvanCloud (set `endpoint`, and
        `path_style` for MinIO/Arvan). After each upload only the newest
        `retention_count` `wgpanel-backup-*.json` objects under the prefix are kept.
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BackupSchedule" }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupSchedule" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/backup-schedule/run:
    post:
      tags: [Backup]
      summary: Run a backup now
      description: Starts a backup in the background; poll `GET /api/v1/backup-schedule` for the per-destination result.
      security: [{ BearerAuth: [] }]
      responses:
        "202": { description: Started. }
        "400": { description: "`backup_not_configured` - set a password and enable a destination first." }
        "409": { description: "`backup_in_progress`." }

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Admin session access token from POST /api/v1/auth/login (15 minute TTL).
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: >-
        Bot/reseller auth. Must be combined with X-Timestamp and X-Signature
        headers (not separately modelable as OpenAPI security schemes since
        OpenAPI has no concept of "N headers form one signed credential") -
        see the top-level description for the exact signing scheme.
    InternalToken:
      type: apiKey
      in: header
      name: X-Internal-Token
      description: Must equal the INTERNAL_API_TOKEN env var. Gates every /internal/* route.

  responses:
    TooManyAttempts:
      description: "`too_many_attempts` - the username or client IP is locked out after repeated failures. See the `Retry-After` header (seconds)."
      headers:
        Retry-After: { schema: { type: integer }, description: Seconds until the lockout ends. }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    SessionTokens:
      description: Session issued.
      content:
        application/json:
          schema:
            type: object
            properties:
              access_token: { type: string }
              refresh_token: { type: string }
              expires_in_seconds: { type: integer, example: 900 }
    PasskeyOptions:
      description: WebAuthn options (`options.publicKey`, base64url-encoded binary fields) and the Redis-held `session_id` to send back to the matching finish call.
      content:
        application/json:
          schema:
            type: object
            properties:
              session_id: { type: string }
              options: { type: object }
    RecoveryCodes:
      description: Ten one-time recovery codes, shown only this once.
      content:
        application/json:
          schema:
            type: object
            properties:
              recovery_codes: { type: array, items: { type: string }, example: ["abcde-fghij"] }
    BadRequest:
      description: "`invalid_request` - malformed JSON body or missing/invalid required fields."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Unauthorized:
      description: >-
        Missing/invalid/expired bearer token, or missing/invalid API-key
        headers, or (for API keys) `stale_timestamp`/`invalid_timestamp`.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Forbidden:
      description: >-
        `forbidden` - authenticated but not permitted: a `support`-role admin
        attempting a write, an admin below the operation's minimum role, or an
        API key missing the required permission.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    NotFound:
      description: No resource with that id (or, for API-key callers, one outside their scope - returned as 404 rather than 403 to avoid confirming existence).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    RateLimited:
      description: >-
        `rate_limited` - the caller's token bucket is empty. Retry after the
        `Retry-After` interval.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema: { type: integer, minimum: 1 }
        X-RateLimit-Limit:
          description: Bucket capacity (burst).
          schema: { type: integer }
        X-RateLimit-Remaining:
          description: Whole tokens left (0 here).
          schema: { type: integer }
        X-RateLimit-Reset:
          description: Seconds until the bucket is full again.
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    InternalError:
      description: "`internal_error` - unexpected server-side failure."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  schemas:
    NotificationChannel:
      type: object
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [telegram, email] }
        name: { type: string }
        enabled: { type: boolean }
        config: { type: object, additionalProperties: true }
        has_secret: { type: boolean }
        events: { type: array, items: { type: string } }
        lang: { type: string, enum: [en, fa] }
        broken: { type: boolean, description: "3 or more consecutive delivery failures." }
        consecutive_failures: { type: integer }
        last_error: { type: string }
        last_success_at: { type: string, format: date-time, nullable: true }
        last_failure_at: { type: string, format: date-time, nullable: true }

    NotificationChannelWrite:
      type: object
      properties:
        kind: { type: string, enum: [telegram, email], description: Create only. }
        name: { type: string }
        enabled: { type: boolean }
        config: { type: object, additionalProperties: true }
        secret: { type: string, description: Bot token or SMTP password (write-only). }
        events: { type: array, items: { type: string } }
        lang: { type: string, enum: [en, fa] }

    Webhook:
      type: object
      properties:
        id: { type: string, format: uuid }
        namespace: { type: string, nullable: true, description: "null = global (staff-managed)." }
        url: { type: string }
        description: { type: string }
        events: { type: array, items: { type: string }, description: "Empty = every event." }
        enabled: { type: boolean }
        created_at: { type: string, format: date-time }
        secret: { type: string, description: Present only in the create / rotate-secret response. }

    WebhookWrite:
      type: object
      properties:
        url: { type: string, format: uri }
        description: { type: string }
        events: { type: array, items: { type: string } }
        enabled: { type: boolean }

    WebhookDelivery:
      type: object
      properties:
        id: { type: string, format: uuid }
        webhook_id: { type: string, format: uuid }
        event: { type: string }
        event_id: { type: string }
        status: { type: string, enum: [pending, retrying, success, failed] }
        attempts: { type: integer }
        next_attempt_at: { type: string, format: date-time, nullable: true }
        response_status: { type: integer, nullable: true }
        latency_ms: { type: integer, nullable: true }
        response_body: { type: string, description: Truncated to 1 KB. }
        error: { type: string }
        payload: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    BackupSchedule:
      type: object
      properties:
        enabled: { type: boolean }
        interval_hours: { type: integer, minimum: 1, maximum: 8760 }
        retention_count: { type: integer, minimum: 1, maximum: 365 }
        password: { type: string, description: Write-only encryption password (min 8). }
        has_password: { type: boolean }
        telegram:
          type: object
          properties:
            enabled: { type: boolean }
            bot_token: { type: string, description: Write-only. }
            has_token: { type: boolean }
            chat_id: { type: string }
        s3:
          type: object
          properties:
            enabled: { type: boolean }
            endpoint: { type: string, description: "Empty = AWS (https://s3.<region>.amazonaws.com)." }
            region: { type: string }
            bucket: { type: string }
            prefix: { type: string }
            access_key: { type: string }
            secret_key: { type: string, description: Write-only. }
            has_secret: { type: boolean }
            path_style: { type: boolean }
        last_run_at: { type: string, format: date-time, nullable: true }
        running: { type: boolean }
        last:
          type: object
          additionalProperties: { $ref: "#/components/schemas/BackupRun" }
        runs: { type: array, items: { $ref: "#/components/schemas/BackupRun" } }

    BackupRun:
      type: object
      properties:
        run_id: { type: string }
        destination: { type: string, enum: [telegram, s3] }
        trigger: { type: string, enum: [schedule, manual] }
        status: { type: string, enum: [success, failed] }
        error: { type: string }
        filename: { type: string }
        size_bytes: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }

    Report:
      type: object
      properties:
        range:
          type: object
          properties:
            key: { type: string }
            from: { type: string, format: date-time }
            to: { type: string, format: date-time }
            bucket: { type: string, enum: [hour, day] }
        scope:
          type: object
          properties:
            reseller_id: { type: string, nullable: true }
            owner: { type: string, nullable: true }
        totals:
          type: object
          properties:
            rx_bytes: { type: integer, format: int64 }
            tx_bytes: { type: integer, format: int64 }
            active_accounts: { type: integer, description: Accounts with any traffic in range. }
            new_accounts: { type: integer, description: Accounts created in range. }
            accounts_total: { type: integer }
            accounts_active: { type: integer }
            accounts_suspended: { type: integer }
            accounts_on_hold: { type: integer, description: "Subset of `accounts_active`: accounts still waiting for their first handshake." }
            online_now: { type: integer, description: Accounts with a peer handshake in the last 3 minutes. }
        traffic_series:
          type: array
          items:
            type: object
            properties:
              ts: { type: string, format: date-time }
              rx_bytes: { type: integer, format: int64 }
              tx_bytes: { type: integer, format: int64 }
              active_accounts: { type: integer }
        new_accounts_series:
          type: array
          items:
            type: object
            properties:
              ts: { type: string, format: date-time }
              count: { type: integer }
        status_breakdown:
          type: array
          items:
            type: object
            properties:
              status: { type: string }
              reason: { type: string, nullable: true }
              count: { type: integer }
        quota_buckets:
          type: array
          description: "Always five entries: unlimited, lt50, 50to80, 80to100, exceeded."
          items:
            type: object
            properties:
              bucket: { type: string }
              count: { type: integer }
        expiry_buckets:
          type: array
          description: "Always seven mutually exclusive entries: expired, today, 3d, 7d, 30d, later, never."
          items:
            type: object
            properties:
              bucket: { type: string }
              count: { type: integer }
        expiring:
          type: array
          description: Active accounts expiring within 7 days, soonest first, max 20.
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              label: { type: string }
              owner: { type: string, nullable: true }
              reseller_id: { type: string, nullable: true }
              expiry_at: { type: string, format: date-time }
              status: { type: string }
              data_used_bytes: { type: integer, format: int64 }
              data_quota_bytes: { type: integer, format: int64, nullable: true }
        top_accounts:
          type: array
          description: By rx+tx in range, max 10.
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              label: { type: string }
              owner: { type: string, nullable: true }
              reseller_id: { type: string, nullable: true }
              rx_bytes: { type: integer, format: int64 }
              tx_bytes: { type: integer, format: int64 }
        nodes:
          type: array
          description: Traffic from the scoped accounts only. Staff with no filter see every node; otherwise only nodes the scoped accounts use.
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              status: { type: string }
              rx_bytes: { type: integer, format: int64 }
              tx_bytes: { type: integer, format: int64 }
              accounts: { type: integer }
              cpu_avg: { type: number, nullable: true }
              mem_avg_percent: { type: number, nullable: true }
        resellers:
          type: array
          nullable: true
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              username: { type: string }
              disabled: { type: boolean }
              expires_at: { type: string, format: date-time, nullable: true }
              accounts: { type: integer }
              data_allocated_bytes: { type: integer, format: int64 }
              data_limit_bytes: { type: integer, format: int64, nullable: true }
              rx_bytes: { type: integer, format: int64 }
              tx_bytes: { type: integer, format: int64 }

    Reseller:
      type: object
      description: >-
        A reseller login with its limits (null = unlimited; empty node_groups = all
        groups) and live usage. Reseller quota errors on account create/update/renew use
        codes `reseller_account_limit_reached` (409), `reseller_data_credit_exceeded` (409),
        `reseller_unlimited_not_allowed` (422), `reseller_expiry_too_long` (422),
        `reseller_expiry_required` (422), `reseller_node_group_not_allowed` (422),
        `reseller_disabled` (403), `account_suspended_by_admin` (403). Sessions of a
        disabled / expired reseller get 401 `account_disabled` / `reseller_expired`.
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        namespace: { type: string, example: "reseller:6f0c..." }
        disabled: { type: boolean }
        notes: { type: string }
        max_accounts: { type: integer, nullable: true }
        data_limit_bytes: { type: integer, format: int64, nullable: true }
        node_groups: { type: array, items: { type: string } }
        expires_at: { type: string, format: date-time, nullable: true, description: "Reseller plan end date; null = never. After it the reseller is blocked (401 reseller_expired); its accounts keep working and none may expire after it." }
        usage:
          type: object
          properties:
            accounts_used: { type: integer }
            data_allocated_bytes: { type: integer, format: int64 }
            data_used_bytes: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ErrorEnvelope:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: >-
                Stable machine-readable identifier. Known values include:
                invalid_request, invalid_csr, invalid_credentials,
                invalid_refresh_token, invalid_token, client_certificate_required,
                certificate_superseded, unauthorized, invalid_timestamp,
                stale_timestamp, forbidden, node_group_not_allowed, node_not_found,
                account_not_found, api_key_not_found, node_not_registered,
                node_capacity_exceeded, no_available_node, external_ref_taken,
                node_missing_public_key, username_taken, key_id_collision,
                node_name_taken, not_ready, internal_error.
            message:
              type: string
              description: Human-readable; may change wording - do not match against this.
      required: [error]

    Node:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        node_group: { type: string, example: default }
        region:
          type: string
          example: eu
          description: Free-form steering label; "" = unassigned. Subscription/steer requests carrying ?region= prefer nodes whose region matches (case-insensitive).
        public_endpoint: { type: string, example: "vpn1.example.com:51820" }
        wg_subnet: { type: string, example: "10.66.0.0/24" }
        capacity_max_peers: { type: integer, example: 250 }
        status:
          type: string
          enum: [pending, registered, online, offline]
          description: >-
            pending = created, no join token redeemed yet. registered =
            join token redeemed, agent hasn't sent a heartbeat yet. online =
            agent is sending heartbeats. offline = no heartbeat within the
            stale threshold. Account creation accepts registered or online.
        public_key:
          type: string
          nullable: true
          description: Set once the node's agent reports its own WireGuard server public key.
        created_at: { type: string, format: date-time }
        obfuscation:
          $ref: "#/components/schemas/NodeObfuscation"
          description: Present on node reads. `mode` is `awg` when the node really runs AmneziaWG.
      required: [id, name, node_group, public_endpoint, wg_subnet, capacity_max_peers, status, created_at]

    ObfuscationParams:
      type: object
      description: >-
        AmneziaWG parameters. 0 / "" means not set (the line is omitted from
        configs). See `POST /obfuscation/profiles` for the validation rules.
      properties:
        jc: { type: integer, example: 6, description: Junk packets sent before each handshake (recommended 4-12). }
        jmin: { type: integer, example: 50 }
        jmax: { type: integer, example: 300 }
        s1: { type: integer, example: 20, description: Handshake init padding. }
        s2: { type: integer, example: 30, description: Handshake response padding. }
        s3: { type: integer, example: 10, description: "awg2: cookie reply padding." }
        s4: { type: integer, example: 8, description: "awg2: padding of every transport packet." }
        h1: { type: string, example: "100-200", description: "Init header: a number (awg1) or a range (awg2). h1-h4 are all set or all empty." }
        h2: { type: string, example: "300-400" }
        h3: { type: string, example: "500-600" }
        h4: { type: string, example: "700-800" }
        i1: { type: string, example: "<b 0xc0><r 40>", description: "awg2: custom signature packet (CPS), sent before each handshake." }
        i2: { type: string }
        i3: { type: string }
        i4: { type: string }
        i5: { type: string }

    ObfuscationProfile:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        compat: { type: string, enum: [awg1, awg2], description: "awg1 = 1.x parameters only (broadest client support); awg2 adds s3/s4, header ranges and i1-i5." }
        params: { $ref: "#/components/schemas/ObfuscationParams" }
        revision: { type: integer, description: Bumped on every parameter change or rotation. }
        node_count: { type: integer, description: Nodes this profile is assigned to. }
        stock_client_compatible: { type: boolean, description: Junk-only profile - stock WireGuard clients still connect to its nodes. }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      required: [id, name, compat, params, revision, node_count, created_at, updated_at]

    ObfuscationPreset:
      type: object
      properties:
        id: { type: string, enum: [compatible, awg1, awg2-quic, awg2-dns] }
        name: { type: string }
        description: { type: string }
        compat: { type: string, enum: [awg1, awg2] }
        stock_client_compatible: { type: boolean }

    NodeObfuscation:
      type: object
      description: >-
        What a node runs and what the panel wants it to run. `mode` is what the
        agent last REPORTED running; the panel hands out AWG client configs only
        when `applied` is true (the node runs the assigned profile at its current
        revision). Staff see the profile fields; resellers and API keys only
        `mode`, `applied`, `pending` and `supported`.
      properties:
        mode: { type: string, enum: [wireguard, awg] }
        profile_id: { type: string, format: uuid }
        profile_name: { type: string }
        profile_compat: { type: string, enum: [awg1, awg2] }
        profile_revision: { type: integer }
        applied_revision: { type: integer, description: Revision the agent reports running. }
        applied: { type: boolean }
        pending: { type: boolean, description: A profile is assigned but not (yet) applied. }
        supported: { type: boolean, description: "The node image can run AWG (binaries and /dev/net/tun present). Old node containers need `devices: [/dev/net/tun:/dev/net/tun]` added to their docker-compose.yml." }
        error: { type: string, description: The agent's last apply error. }
      required: [mode, applied, pending, supported]

    NodeEndpoint:
      type: object
      properties:
        id: { type: string, format: uuid }
        node_id: { type: string, format: uuid }
        label: { type: string }
        address: { type: string, example: "relay.example.ir:51820" }
        kind: { type: string, enum: [direct, relay] }
        priority: { type: integer, description: Higher wins. }
        enabled: { type: boolean }
        mtu: { type: integer, nullable: true, description: Per-endpoint client MTU override (1200-1420). }
        health_check: { type: string, enum: [none, tcp], description: "`tcp` = TCP connect to `address` (many relays also listen on TCP on the same port)." }
        last_status: { type: string, enum: [unknown, up, down] }
        last_checked_at: { type: string, format: date-time, nullable: true }
        last_latency_ms: { type: integer, nullable: true }
        created_at: { type: string, format: date-time }
      required: [id, node_id, label, address, kind, priority, enabled, health_check, last_status, created_at]

    SubscriptionInfo:
      type: object
      properties:
        label: { type: string }
        status: { type: string, enum: [active, suspended] }
        status_reason: { type: string, enum: [expired, quota_exceeded], nullable: true }
        data_quota_bytes: { type: integer, format: int64, nullable: true, description: "null = unlimited. Decimal bytes (1 GB = 1e9)." }
        data_used_bytes: { type: integer, format: int64 }
        expiry_at: { type: string, format: date-time, nullable: true }
        days_left: { type: integer, nullable: true, description: Whole days rounded up; negative once expired. }
        device_limit: { type: integer, nullable: true }
        devices_active: { type: integer }
        last_handshake_at: { type: string, format: date-time, nullable: true }
        support_contact: { type: string, nullable: true }
        config_path: { type: string, example: "/api/v1/sub/<token>?format=conf" }
        nodes:
          type: array
          items:
            type: object
            properties:
              node_id: { type: string, format: uuid }
              name: { type: string }
              region: { type: string }
              online: { type: boolean }
              recommended: { type: boolean }
              config_path: { type: string }
              awg: { type: boolean, description: This node's configs are AmneziaWG and need an AWG client app. }
        obfuscation:
          type: object
          description: >-
            Whether the config the page downloads (the best node's) is AmneziaWG,
            and the apps that can import it. Never carries the parameters.
          properties:
            awg: { type: boolean }
            compat: { type: string, enum: [awg1, awg2], description: "awg2 configs need a recent app version." }
            apps:
              type: array
              description: Filled when any of the account's nodes is AWG.
              items:
                type: object
                properties:
                  os: { type: string, enum: [android, ios, windows, macos, linux] }
                  name: { type: string, example: AmneziaVPN }
                  url: { type: string }
      required: [label, status, data_used_bytes, config_path, nodes]

    NodeNetwork:
      type: object
      description: >-
        What the node's own WireGuard interface must look like for the panel's
        client configs to work.
      properties:
        wg_subnet: { type: string, example: "10.66.0.0/24" }
        wg_interface_address:
          type: string
          example: "10.66.0.1/24"
          description: The subnet's .1 - the address reserved for the node itself.
        public_endpoint: { type: string, example: "vpn1.example.com:51820" }
        wg_listen_port:
          type: integer
          example: 51820
          description: public_endpoint's port; 0 if a legacy endpoint has none.

    CreateNodeRequest:
      type: object
      required: [name, public_endpoint, wg_subnet]
      properties:
        name: { type: string }
        node_group: { type: string, default: default }
        region: { type: string, default: "", description: Optional steering label, e.g. "eu" or "us-east". }
        public_endpoint:
          type: string
          example: "vpn1.example.com:51820"
          description: >-
            host:port clients dial (IPv6 hosts in brackets). Required to include the
            port, which must be the node's WireGuard listen port; stored in canonical form.
        wg_subnet:
          type: string
          example: "10.66.0.0/24"
          description: IPv4 CIDR, /16 to /30. Stored in network form (10.66.0.5/24 becomes 10.66.0.0/24).
        capacity_max_peers: { type: integer, default: 250 }
        public_key:
          type: string
          nullable: true
          description: Usually left unset at creation time and filled in later by the agent's first registration.

    Account:
      type: object
      properties:
        id: { type: string, format: uuid }
        owner:
          type: string
          nullable: true
          description: Owner namespace - `reseller:<admin id>`, an API key id, or null for accounts created by a staff admin.
        reseller_id:
          type: string
          nullable: true
          description: Admin id of the owning reseller, when the owner is a reseller.
        external_ref:
          type: string
          nullable: true
          description: Caller-supplied idempotency/reference key (e.g. the bot's own user/order id). Unique when set.
        label: { type: string }
        public_key: { type: string, description: "This account's WireGuard public key, shared across every node it has a peer on (private key is never returned except via GET .../config)." }
        peers:
          type: array
          description: >-
            Every node this account currently has a WireGuard peer on (see
            docs/STORY-09-multi-node-accounts.md) - typically every eligible
            node in the fleet, unless the account was pinned to one at creation.
          items: { $ref: "#/components/schemas/AccountPeer" }
        data_quota_bytes: { type: integer, format: int64, nullable: true, description: null = unlimited }
        data_used_bytes: { type: integer, format: int64 }
        expiry_at: { type: string, format: date-time, nullable: true, description: null = never expires }
        device_limit: { type: integer, nullable: true, description: null = unlimited }
        device_limit_exceeded:
          type: boolean
          description: >-
            True while distinct active source endpoints (rolling 5-minute window)
            exceed device_limit - a detection signal, not a cutoff, unless
            device_limit_hard_enforce is on. Cleared automatically once back under.
        device_limit_hard_enforce:
          type: boolean
          description: When true, exceeding the device limit auto-suspends the account (suspend_reason = device_limit) instead of only flagging it.
        bandwidth_limit_mbps:
          type: integer
          nullable: true
          description: Per-account rate limit enforced by every node agent via tc; null = unshaped.
        subscription_path:
          type: string
          example: /api/v1/sub/0a1b2c...
          description: >-
            Relative capability URL serving this account's current wg-quick config
            with no further authentication - prepend the panel's public origin.
            Rotate via POST .../subscription/rotate if it leaks.
        subscription_url:
          type: string
          nullable: true
          example: https://sub.example.com:8443/api/v1/sub/0a1b2c...
          description: >-
            Absolute form of subscription_path on the separate subscription origin
            (Settings' sub_domain/sub_port), or null when no separate origin is
            configured - fall back to prepending the panel's own origin to
            subscription_path, as before.
        status:
          type: string
          enum: [active, suspended, deleted]
        suspend_reason:
          type: string
          nullable: true
          enum: [manual, abuse_flag, expired, quota_exceeded, device_limit, reseller_suspended]
          description: >-
            Why a `suspended` account is suspended; null otherwise.
            `quota_exceeded` is set **automatically** when an active account's
            `data_used_bytes` reaches its non-null `data_quota_bytes`, and is
            lifted automatically when the quota moves above the usage (PATCH,
            renew) or the usage is reset - never while the account is expired.
            `expired` is set automatically past `expiry_at` and wins over
            `quota_exceeded` when both apply. `manual` / `abuse_flag` are set by
            `POST .../suspend`, `device_limit` by device-limit hard enforcement,
            and `reseller_suspended` by the super-admin bulk suspension of a
            reseller's accounts; none of these is ever overwritten or lifted by
            data-cap enforcement.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        last_handshake_at:
          type: string
          format: date-time
          nullable: true
          description: >-
            The most recent WireGuard handshake across all of the account's
            peers (the newest of its peers' own `last_handshake_at`), or null if
            none of them has ever connected. Always present.
        node_id:
          type: string
          format: uuid
          nullable: true
          deprecated: true
          description: Deprecated - mirrors peers[0].node_id, or null if the account has no peers yet. Use peers instead. Kept for one release as a bot-integration compatibility bridge from the pre-multi-node model.
        assigned_ip:
          type: string
          nullable: true
          deprecated: true
          description: Deprecated - mirrors peers[0].assigned_ip. Use peers instead.
        on_hold:
          type: boolean
          description: >-
            True while the account waits for its first WireGuard handshake: its validity clock
            has not started, `expiry_at` is null and `hold_duration_days` is the validity it
            will get. An on-hold account is still `status: active` (it can connect) and still
            counts in every `active` total; reports expose the subset as `accounts_on_hold`.
        hold_duration_days: { type: integer, nullable: true, description: "Validity (days) granted at activation; non-null only while on hold." }
        hold_deadline_at:
          type: string
          format: date-time
          nullable: true
          description: If the account is still on hold at this time it is activated anyway (the clock starts then). Null = no deadline.
        activated_at: { type: string, format: date-time, nullable: true, description: When an on-hold account left the hold (first handshake, deadline, or a fixed `expiry_at` set by PATCH). }
        reset_strategy: { type: string, enum: [none, day, week, month, year], description: Scheduled reset of `data_used_bytes`. }
        next_reset_at: { type: string, format: date-time, nullable: true, description: Next scheduled reset; null when the strategy is `none` or the account is still on hold. }
        last_reset_at: { type: string, format: date-time, nullable: true, description: Last usage reset, manual or scheduled. }
      required: [id, label, public_key, peers, data_used_bytes, status, created_at, updated_at, last_handshake_at, on_hold, reset_strategy]

    AccountPeer:
      type: object
      properties:
        node_id: { type: string, format: uuid }
        node_name: { type: string }
        assigned_ip: { type: string, example: "10.66.0.4" }
      required: [node_id, node_name, assigned_ip]

    CreateAccountRequest:
      type: object
      required: [label]
      properties:
        external_ref: { type: string, nullable: true }
        label: { type: string }
        node_id:
          type: string
          nullable: true
          description: >-
            Omit (or send "auto") to give the account a peer on every currently
            eligible node - the default and recommended behavior. Pass a
            specific node UUID to pin the account to just that one node instead.
        data_quota_gb: { type: number, nullable: true }
        expiry_at: { type: string, format: date-time, nullable: true }
        device_limit: { type: integer, nullable: true }
        bandwidth_limit_mbps: { type: integer, nullable: true, minimum: 1, maximum: 100000, description: Omit/null = unshaped. }
        template_id:
          type: string
          format: uuid
          nullable: true
          description: >-
            Plan template to start from (`GET /api/v1/templates`). Any field sent explicitly
            overrides the template's value. A template's `node_group` narrows the automatic
            node choice. 404 `template_not_found` if the template does not exist or is not
            visible to the caller.
        on_hold:
          type: boolean
          nullable: true
          description: >-
            Start the expiry clock at the first handshake instead of now. Needs
            `hold_duration_days` (or a template `duration_days`); cannot be combined with
            `expiry_at`. Overrides the template's `on_hold`.
        hold_duration_days: { type: integer, nullable: true, minimum: 1, maximum: 3650, description: "Validity granted at activation (on hold only)." }
        hold_deadline_days: { type: integer, nullable: true, minimum: 1, maximum: 3650, description: "Activate anyway this many days after creation if there was no handshake (on hold only)." }
        reset_strategy: { type: string, nullable: true, enum: [none, day, week, month, year], description: "Zero data_used_bytes on a schedule." }

    PlanTemplate:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        owner: { type: string, nullable: true, description: "Null = global (staff) template; otherwise the owner namespace." }
        available_to_resellers: { type: boolean, description: "Global templates only: visible to resellers and API keys." }
        data_quota_bytes: { type: integer, format: int64, nullable: true, description: "Null = unlimited." }
        duration_days: { type: integer, nullable: true }
        device_limit: { type: integer, nullable: true }
        bandwidth_limit_mbps: { type: integer, nullable: true }
        node_group: { type: string, nullable: true }
        reset_strategy: { type: string, enum: [none, day, week, month, year] }
        on_hold: { type: boolean }
        hold_deadline_days: { type: integer, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      required: [id, name, available_to_resellers, reset_strategy, on_hold, created_at, updated_at]

    TemplateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 100 }
        available_to_resellers: { type: boolean, description: "Staff-created templates only; ignored otherwise." }
        data_quota_gb: { type: number, nullable: true }
        duration_days: { type: integer, nullable: true, minimum: 1, maximum: 3650 }
        device_limit: { type: integer, nullable: true, minimum: 1 }
        bandwidth_limit_mbps: { type: integer, nullable: true, minimum: 1, maximum: 100000 }
        node_group: { type: string, nullable: true }
        reset_strategy: { type: string, enum: [none, day, week, month, year] }
        on_hold: { type: boolean, description: "Needs duration_days." }
        hold_deadline_days: { type: integer, nullable: true, minimum: 1, maximum: 3650 }

    BulkAccountsRequest:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [create, renew, suspend, enable, delete, reset_usage] }
        count: { type: integer, minimum: 1, maximum: 200, description: "create: how many accounts." }
        label_prefix: { type: string, description: "create: labels are `<prefix>-01`, `<prefix>-02`, ..." }
        template_id: { type: string, format: uuid, nullable: true, description: "create: as in POST /accounts." }
        data_quota_gb: { type: number, nullable: true, description: "create: as in POST /accounts (external_ref is not allowed)." }
        expiry_at: { type: string, format: date-time, nullable: true }
        device_limit: { type: integer, nullable: true }
        bandwidth_limit_mbps: { type: integer, nullable: true }
        node_id: { type: string, nullable: true }
        on_hold: { type: boolean, nullable: true }
        hold_duration_days: { type: integer, nullable: true }
        hold_deadline_days: { type: integer, nullable: true }
        reset_strategy: { type: string, nullable: true, enum: [none, day, week, month, year] }
        ids:
          type: array
          maxItems: 200
          items: { type: string, format: uuid }
          description: "renew / suspend / enable / delete / reset_usage: the accounts to act on."
        extend_days: { type: integer, minimum: 1, maximum: 3650, description: "renew: as in POST .../renew." }
        add_quota_gb: { type: number, minimum: 0, description: "renew: as in POST .../renew." }

    BulkAccountsResponse:
      type: object
      properties:
        action: { type: string }
        total: { type: integer }
        succeeded: { type: integer }
        failed: { type: integer }
        results:
          type: array
          description: "One entry per item, in request order (create: in label order)."
          items:
            type: object
            properties:
              id: { type: string, nullable: true }
              label: { type: string }
              ok: { type: boolean }
              account: { allOf: [{ $ref: "#/components/schemas/Account" }], nullable: true }
              error:
                type: object
                nullable: true
                properties:
                  code: { type: string }
                  message: { type: string }
            required: [ok]
      required: [action, total, succeeded, failed, results]

    ApiKey:
      type: object
      properties:
        id: { type: string, format: uuid }
        key_id: { type: string, description: "Public identifier - this is the value sent as X-API-Key." }
        label: { type: string }
        node_groups:
          type: array
          items: { type: string }
          description: Empty = unrestricted.
        permissions:
          type: array
          items:
            type: string
            enum: [read, create, update, suspend, delete, webhooks]
        revoked: { type: boolean }
        reseller_id:
          type: string
          format: uuid
          nullable: true
          description: Owning reseller; null for a staff-created key. Requests with a reseller-owned key get 401 `reseller_disabled` / `reseller_expired` when the reseller is disabled / past its plan end date.
        created_at: { type: string, format: date-time }
      required: [id, key_id, label, node_groups, permissions, revoked, created_at]

    ApiKeyCreated:
      allOf:
        - $ref: "#/components/schemas/ApiKey"
        - type: object
          properties:
            secret:
              type: string
              description: Shown exactly once - store it now, it cannot be retrieved again (only rotated).
          required: [secret]

    AdminUser:
      type: object
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        role:
          type: string
          enum: [super_admin, operator, support]
        created_at: { type: string, format: date-time }
        totp_enabled: { type: boolean, description: "List only: TOTP two-factor is confirmed." }
        passkey_count: { type: integer, description: "List only: number of registered passkeys." }
      required: [id, username, role, created_at]

    Passkey:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time, nullable: true }
      required: [id, name, created_at]

    SecuritySettings:
      type: object
      properties:
        admin_ip_allowlist: { type: array, items: { type: string } }
        login_max_failures: { type: integer, example: 5 }
        login_lockout_minutes: { type: integer, example: 15 }
        your_ip: { type: string, description: "The caller's IP as the panel sees it." }
      required: [admin_ip_allowlist, login_max_failures, login_lockout_minutes, your_ip]

    AdminCreateResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        role: { type: string, enum: [super_admin, operator, support] }
      required: [id, username, role]

    AuditLogEntry:
      type: object
      properties:
        id: { type: integer, format: int64 }
        actor:
          type: string
          description: Admin username, "node-agent" for agent-originated events, or the API key's label for bot-originated events.
        action: { type: string, example: account.suspended }
        target: { type: string, nullable: true, description: Usually the affected resource's id. }
        detail:
          type: object
          nullable: true
          additionalProperties: true
          description: Free-form JSON, action-specific (e.g. {"reason":"manual"}).
        ip_address: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
      required: [id, actor, action, created_at]

    Settings:
      type: object
      properties:
        client_mtu:
          type: integer
          minimum: 1200
          maximum: 1420
          default: 1280
          description: >-
            The `MTU =` line of generated client configs. Lower it if clients on
            some networks connect but stall on large downloads; a node endpoint's
            own `mtu` overrides it. Applies to the next config download.
        api_rate_rps:
          type: integer
          minimum: 1
          maximum: 10000
          default: 20
          description: Bot API token-bucket refill rate per API key (requests/second).
        api_rate_burst:
          type: integer
          minimum: 1
          maximum: 100000
          default: 40
          description: Bot API token-bucket capacity per API key.
        public_base_url:
          type: string
          nullable: true
          description: >-
            The domain this panel is served on (e.g. "https://panel.example.com").
            Informational only - editing this does not move DNS/TLS, which is still
            configured via deploy/.env's PANEL_DOMAIN and requires a redeploy.
        default_data_quota_gb:
          type: number
          nullable: true
          description: Pre-fills the admin panel's "New account" dialog quota field. null = no default (unlimited).
        default_device_limit:
          type: integer
          nullable: true
          description: Pre-fills the admin panel's "New account" dialog device-limit field. null = no default (unlimited).
        default_node_capacity:
          type: integer
          description: Pre-fills the admin panel's "New node" dialog capacity field.
        support_contact:
          type: string
          nullable: true
          description: Shown to other admins who need help (e.g. an email address or Telegram handle).
        panel_domain:
          type: string
          nullable: true
          example: panel.example.com
          description: >-
            The live-managed TLS domain Caddy serves the panel on (unlike
            public_base_url, which is informational only). Setting it via PATCH
            persists it AND pushes it to Caddy's admin API live - see
            domain_live_applied/domain_apply_error on the PATCH response. null =
            never set from the panel; Caddy runs the .env PANEL_DOMAIN it booted with.
        client_dns:
          type: string
          example: node
          description: >-
            The DNS = line of every generated wg-quick config. `node` (the default)
            points each node's clients at that node's own DNS forwarder on its tunnel
            address, which resolves through the node server's resolver; nodes whose
            agent predates the forwarder get `1.1.1.1, 1.0.0.1` instead. Otherwise a
            comma-separated list of resolver IPs (optionally with search domains).
            Takes effect on the next config download.
        sub_domain:
          type: string
          nullable: true
          example: sub.example.com
          description: >-
            Optional separate domain for subscription URLs. When set, Caddy serves
            ONLY /api/v1/sub/* on it (with its own automatic certificate) and
            account responses carry an absolute subscription_url built from it.
            Live-pushed like panel_domain. On PATCH, "" explicitly clears it back
            to off (unlike other nullable settings, which can't be cleared).
        sub_port:
          type: integer
          nullable: true
          minimum: 1
          maximum: 65535
          description: >-
            Public HTTPS port for the subscription origin. null = 443 (shares the
            panel's port via SNI, no extra setup). Any other port must match the
            SUB_PORT published in deploy/.env. On PATCH, 0 explicitly resets to
            the default.
      required: [default_node_capacity, client_dns]

    BackupEnvelope:
      type: object
      description: >-
        The wgpanel-backup-enc/1 format: an argon2id + AES-256-GCM envelope. Only
        format and created_at are readable without the password. `kdf` carries the
        argon2id parameters the file was sealed with (salt base64, t/m/p costs);
        `data` is the base64 ciphertext of the backup payload - config tables as
        json_agg rows, the CA keypair (PEM), the applied-migrations list (restore
        requires an exact match), and the deployment's encryption keys.
      required: [format, created_at, kdf, nonce, data]
      properties:
        format: { type: string, enum: [wgpanel-backup-enc/1] }
        created_at: { type: string, format: date-time }
        kdf:
          type: object
          required: [salt, t, m, p]
          properties:
            salt: { type: string, description: base64 (raw, unpadded) }
            t: { type: integer }
            m: { type: integer, description: memory cost in KB }
            p: { type: integer }
        nonce: { type: string, description: base64 (raw, unpadded) }
        data: { type: string, description: base64 (raw, unpadded) AES-256-GCM ciphertext }

    RestoreResult:
      type: object
      required: [restored, ca_restored, restart_required]
      properties:
        restored:
          type: object
          additionalProperties: { type: integer }
          description: Rows restored per table.
        ca_restored:
          type: boolean
          description: The backup carried a CA keypair and it was written to disk.
        restart_required:
          type: boolean
          description: >-
            The restored CA differs from the one loaded at startup - node-agent
            mTLS keeps using the old CA until the api container is restarted.

    SettingsUpdateResult:
      allOf:
        - $ref: "#/components/schemas/Settings"
        - type: object
          properties:
            domain_live_applied:
              type: boolean
              description: >-
                Only meaningful when the request included panel_domain, sub_domain
                or sub_port: true when the new config was pushed to Caddy live.
            domain_apply_error:
              type: string
              nullable: true
              description: >-
                Why the live push failed, if it did. The values are still persisted
                either way; the API re-applies them from the database on its next
                startup.
